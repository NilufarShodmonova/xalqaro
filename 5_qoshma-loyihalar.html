<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Qoʻshma infratuzilma loyihalari · Совместные инфраструктурные проекты · Joint infrastructure projects</title>
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#070d18}
body{font-family:"Manrope","Segoe UI",Helvetica,Arial,sans-serif;color:#f5eedf;user-select:none}
:root{--g:#c9973f;--gl:#e3b25e;--gp:#f0d9a8;--dim:#a7b8cd;--line:rgba(201,151,63,.32);
 --ink:#40301a;--ink2:#5b492f;
 --serif:"Cormorant Garamond","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
 --e:cubic-bezier(.22,.9,.28,1)}
#deck{position:fixed;inset:0;perspective:1600px}

/* ---------- слайд: вход и выход ---------- */
.sl{position:absolute;inset:0;opacity:0;visibility:hidden;
 transition:opacity .9s var(--e), visibility .9s, transform 1.1s var(--e);
 transform:scale(1.015)}
.sl.on{opacity:1;visibility:visible;transform:none;z-index:2}
.sl.out{opacity:0;transform:scale(.985);z-index:1}

/* ---------- фотослайды: медленное движение кадра ---------- */
.vis{position:absolute;inset:0;overflow:hidden;background:#0a1320}
.vis img{width:100%;height:100%;display:block;transform-origin:50% 45%}
.vis.cover img{object-fit:cover;object-position:50% 45%}
.vis.contain img{object-fit:contain;padding:5vh 5vw 27vh}
.vis.contain{background:radial-gradient(120% 100% at 50% 18%,#16283f,#080e18)}
@keyframes kb-in{from{transform:scale(1.005) translate3d(0,0,0)}to{transform:scale(1.10) translate3d(-1.2%,-1%,0)}}
@keyframes kb-out{from{transform:scale(1.10) translate3d(1%,-.8%,0)}to{transform:scale(1.005) translate3d(0,0,0)}}
.sl.on .vis.cover img{animation:kb-in 15s linear both}
.sl.on .vis.cover.alt img{animation:kb-out 15s linear both}
@keyframes soft{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
.sl.on .vis.contain img{animation:soft 1.5s var(--e) both}
.scrim{position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(180deg,rgba(7,13,24,.62) 0%,rgba(7,13,24,.10) 22%,rgba(7,13,24,.52) 56%,rgba(7,13,24,.96) 100%)}

/* ---------- подписи ---------- */
@keyframes up{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
@keyframes upS{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes grow{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:none}}
@keyframes track{from{opacity:0;letter-spacing:.9em}to{opacity:1;letter-spacing:.42em}}
.cap{position:absolute;left:0;right:0;bottom:0;padding:0 7vw 8vh;z-index:3}
.cap h2{font-family:var(--serif);font-size:clamp(32px,3.7vw,62px);line-height:1.08;margin:0 0 14px;color:var(--gp)}
.cap p{margin:0;max-width:52em;font-size:clamp(16px,1.3vw,25px);line-height:1.6;color:#eae4d6}
.sl.on .cap h2{animation:up 1s var(--e) .18s both}
.sl.on .cap p{animation:up 1s var(--e) .40s both}
.cr{position:absolute;right:2.6vw;bottom:2.4vh;z-index:3;font-size:clamp(11px,.85vw,15px);
 letter-spacing:.1em;color:#8fa1b6;max-width:44vw;text-align:right}
.sl.on .cr{animation:upS 1s var(--e) .9s both}

/* ---------- чертежи на пергаменте ---------- */
.fig{position:absolute;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#f4efe4,#e6dfd0)}
.fig .art{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4.5vh 5vw 0}
.fig .art img{max-width:100%;max-height:100%;width:auto;height:auto;
 border:1px solid rgba(90,70,40,.32);box-shadow:0 1.6vh 5vh rgba(40,30,10,.26)}
@keyframes figin{from{opacity:0;transform:translateY(26px) scale(.985)}to{opacity:1;transform:none}}
.sl.on .fig .art img{animation:figin 1.3s var(--e) both}
.fig .cap{position:static;padding:3vh 7vw 7vh}
.fig .cap h2{color:var(--ink)} .fig .cap p{color:var(--ink2)} .fig .cr{color:#8b7351}

/* ---------- титул ---------- */
.ti{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
 text-align:center;padding:0 10vw;background:radial-gradient(120% 95% at 50% 12%,#182943,#080e1a)}
.ti .kick{font-size:clamp(12px,1.05vw,19px);letter-spacing:.42em;text-transform:uppercase;color:var(--g);margin-bottom:24px}
.ti h1{font-family:var(--serif);font-size:clamp(42px,5.8vw,104px);line-height:1.02;margin:0 0 18px;color:var(--gp)}
.ti .rule{width:min(320px,40vw);height:1px;background:linear-gradient(90deg,transparent,var(--g),transparent);margin:12px 0 24px}
.ti p{margin:0;max-width:42em;font-size:clamp(16px,1.4vw,26px);line-height:1.6;color:#dcd6c8}
.arch{width:min(150px,15vw);opacity:.32;margin-bottom:2vh}
.arch path{stroke-dasharray:400;stroke-dashoffset:400}
.sl.on .arch path{animation:draw 2.6s var(--e) .2s both}
@keyframes draw{to{stroke-dashoffset:0}}
.sl.on .ti .kick{animation:track 1.5s var(--e) .5s both}
.sl.on .ti h1{animation:up 1.2s var(--e) .8s both}
.sl.on .ti .rule{animation:grow 1.2s var(--e) 1.4s both}
.sl.on .ti p{animation:up 1.1s var(--e) 1.6s both}

/* ---------- списки: пункты выходят по очереди ---------- */
.lst{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
 padding:0 8vw;background:radial-gradient(130% 100% at 18% 10%,#16283f,#080e18)}
.lst h2{font-family:var(--serif);font-size:clamp(32px,3.7vw,62px);margin:0 0 8px;color:var(--gp)}
.lst .sub{font-size:clamp(15px,1.25vw,23px);color:#cfc7b6;max-width:50em;line-height:1.6;margin:0 0 4vh}
.lst ol{list-style:none;margin:0;padding:0;display:grid;gap:2.1vh;counter-reset:n}
.lst li{counter-increment:n;position:relative;padding-left:clamp(52px,4.6vw,84px);
 font-size:clamp(17px,1.45vw,29px);line-height:1.45;color:#f0ead9}
.lst li::before{content:counter(n,decimal-leading-zero);position:absolute;left:0;top:.05em;
 font-family:var(--serif);font-size:clamp(19px,1.7vw,34px);color:var(--g);letter-spacing:.06em}
@keyframes left{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.sl.on .lst h2{animation:up 1s var(--e) .15s both}
.sl.on .lst .sub{animation:up 1s var(--e) .35s both}
.sl.on .lst li{animation:left .85s var(--e) both}
.sl.on .lst li:nth-child(1){animation-delay:.6s}
.sl.on .lst li:nth-child(2){animation-delay:.78s}
.sl.on .lst li:nth-child(3){animation-delay:.96s}
.sl.on .lst li:nth-child(4){animation-delay:1.14s}
.sl.on .lst li:nth-child(5){animation-delay:1.32s}
.sl.on .lst li:nth-child(6){animation-delay:1.5s}

/* ---------- источники ---------- */
#src{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 8vw;
 background:radial-gradient(130% 100% at 82% 8%,#16283f,#080e18)}
#src h2{font-family:var(--serif);font-size:clamp(32px,3.6vw,58px);margin:0 0 3.4vh;color:var(--gp)}
#src ul{list-style:none;margin:0;padding:0;display:grid;gap:1.7vh;max-width:60em}
#src li{position:relative;padding-left:30px;font-size:clamp(14px,1.15vw,22px);line-height:1.5;color:#dcd6c8}
#src li::before{content:'';position:absolute;left:0;top:.55em;width:10px;height:10px;
 border:1.5px solid var(--g);transform:rotate(45deg)}
#src .nt{margin-top:3.4vh;padding-top:2.4vh;border-top:1px dashed var(--line);max-width:60em;
 font-size:clamp(13px,1.02vw,19px);color:#8fa1b6;line-height:1.6}
.sl.on #src h2{animation:up 1s var(--e) .15s both}
.sl.on #src li{animation:upS .8s var(--e) both}
.sl.on #src li:nth-child(1){animation-delay:.45s}.sl.on #src li:nth-child(2){animation-delay:.58s}
.sl.on #src li:nth-child(3){animation-delay:.71s}.sl.on #src li:nth-child(4){animation-delay:.84s}
.sl.on #src li:nth-child(5){animation-delay:.97s}.sl.on #src li:nth-child(6){animation-delay:1.1s}
.sl.on #src .nt{animation:upS .9s var(--e) 1.4s both}

/* ---------- управление ---------- */
#nav{position:fixed;inset:0;pointer-events:none;z-index:20}
#play{position:absolute;left:2.4vw;top:2.4vh;width:clamp(44px,3.4vw,60px);height:clamp(44px,3.4vw,60px);
 border-radius:50%;border:1.5px solid var(--line);background:rgba(9,17,29,.55);color:var(--gp);
 cursor:pointer;pointer-events:auto;display:flex;align-items:center;justify-content:center;
 transition:all .3s var(--e);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#play:hover{border-color:var(--g)}
#play svg{width:44%;height:44%;fill:currentColor}
#dots{position:absolute;left:0;right:0;bottom:2.4vh;display:flex;gap:8px;justify-content:center;
 pointer-events:auto;flex-wrap:wrap;padding:0 6vw}
#dots i{width:8px;height:8px;border-radius:50%;background:rgba(245,238,223,.26);cursor:pointer;
 transition:all .4s var(--e)}
#dots i.on{background:var(--gl);transform:scale(1.6)}
#cnt{position:absolute;right:2.4vw;top:2.6vh;font-family:var(--serif);font-size:clamp(14px,1.15vw,21px);
 letter-spacing:.2em;color:var(--gp);opacity:.85;transition:color .5s ease}
#bar{position:fixed;top:0;left:0;height:3px;width:0;z-index:30;
 background:linear-gradient(90deg,var(--g),var(--gl));box-shadow:0 0 12px rgba(227,178,94,.55)}
body.light #cnt,body.light #play{color:var(--ink)}
body.light #play{background:rgba(255,252,244,.62);border-color:rgba(90,70,40,.3)}
body.light #dots i{background:rgba(64,48,26,.28)}
body.light #dots i.on{background:#a97c2c}

@media (prefers-reduced-motion:reduce){
  .sl.on .vis.cover img,.sl.on .vis.cover.alt img{animation:none}
  .sl,.sl.on{transition:opacity .3s linear;transform:none}
  .sl.on .cap h2,.sl.on .cap p,.sl.on .lst li,.sl.on .lst h2,.sl.on .lst .sub,
  .sl.on .ti h1,.sl.on .ti p,.sl.on .ti .kick,.sl.on #src li,.sl.on .fig .art img
  {animation-duration:.01s!important;animation-delay:0s!important}
}

.num{position:absolute;inset:0;overflow:hidden;background:#0a1320}
.num img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%}
.sl.on .num img{animation:kb-in 17s linear both}
.num .veil{position:absolute;inset:0;background:
 linear-gradient(180deg,rgba(7,13,24,.80) 0%,rgba(7,13,24,.30) 26%,rgba(7,13,24,.72) 58%,rgba(7,13,24,.97) 100%)}
.num .big{position:absolute;left:0;right:0;top:16vh;text-align:center;z-index:3}
.num .big b{display:block;font-family:var(--serif);font-weight:700;line-height:.86;
 color:var(--gp);text-shadow:0 1.2vh 5vh rgba(0,0,0,.75)}
.num .big span{display:block;margin-top:1.4vh;letter-spacing:.42em;text-transform:uppercase;color:var(--g)}
.num .big i{display:block;width:14vw;height:1px;margin:2.6vh auto 0;
 background:linear-gradient(90deg,transparent,var(--g),transparent)}
.sl.on .num .big b{animation:numin 1.5s var(--e) .2s both}
.sl.on .num .big span{animation:track 1.4s var(--e) .7s both}
.sl.on .num .big i{animation:grow 1.2s var(--e) 1s both}
@keyframes numin{from{opacity:0;transform:translateY(40px) scale(.94)}to{opacity:1;transform:none}}
.num .cap{z-index:3}
.vis.portal{background:radial-gradient(120% 100% at 50% 18%,#16283f,#080e18);
 position:absolute;inset:0;display:block;padding:0;overflow:hidden}
.vis.portal img{position:absolute;left:4%;top:5%;width:92%;height:58%;
 max-width:none;max-height:none;object-fit:cover;object-position:50% 45%;
 border-radius:46% 46% 12px 12px / 30% 30% 12px 12px;
 border:1.5px solid rgba(201,151,63,.5);box-shadow:0 2.4vh 9vh rgba(0,0,0,.62)}
.sl.on .vis.portal img{animation:portalin 1.4s var(--e) both}
@keyframes portalin{from{opacity:0;transform:translateY(32px) scale(.975)}to{opacity:1;transform:none}}
@media (min-aspect-ratio:1/1){
  .vis.portal img{left:26%;top:7%;width:48%;height:66%;
    border-radius:46% 46% 10px 10px / 34% 34% 10px 10px}
}

.era{position:absolute;left:7vw;top:8vh;z-index:4;font-size:clamp(11px,.95vw,17px);letter-spacing:.36em;
 text-transform:uppercase;color:var(--g);opacity:.95}
.sl.on .era{animation:track 1.3s var(--e) .1s both}
/* переключатель языка */
#lang{position:fixed;left:2.2vw;top:2.4vh;z-index:40;display:flex;gap:.5rem;pointer-events:auto}
#lang button{padding:.7rem 1.15rem;border-radius:10px;border:1.5px solid var(--line);
 background:rgba(9,17,29,.62);color:var(--gp);font-family:inherit;font-size:clamp(12px,1vw,17px);
 font-weight:700;letter-spacing:.12em;cursor:pointer;transition:all .3s var(--e);
 -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#lang button:hover{border-color:var(--g)}
#lang button.on{background:linear-gradient(180deg,rgba(201,151,63,.34),rgba(22,40,63,.55));
 border-color:var(--g);color:#fff}
body.light #lang button{color:var(--ink);background:rgba(255,252,244,.62);border-color:rgba(90,70,40,.3)}
#play{left:auto;right:2.2vw}
@media (max-aspect-ratio:1/1){
  #lang{left:5vw;top:2.2vh}
  #lang button{padding:1vh 3vw;font-size:clamp(13px,2vw,22px)}
  #play{right:5vw}
  .era{left:7vw}
}

@media (max-aspect-ratio:1/1){
  .cap{padding:0 7vw 9vh}
  .cap h2{font-size:clamp(30px,5.4vw,62px)}
  .cap p{font-size:clamp(15px,2.1vw,27px);max-width:none}
  .cr{font-size:clamp(11px,1.5vw,17px);max-width:70vw;bottom:3.4vh;right:6vw}
  .ti{padding:0 8vw}
  .ti .kick{font-size:clamp(11px,1.9vw,20px);letter-spacing:.3em}
  .ti h1{font-size:clamp(36px,7.6vw,92px);line-height:1.06}
  .ti p{font-size:clamp(15px,2.2vw,28px)}
  .arch{width:min(140px,20vw)}
  .lst{padding:0 7vw}
  .lst h2{font-size:clamp(28px,5.2vw,58px)}
  .lst .sub{font-size:clamp(14px,2vw,25px);margin-bottom:3vh}
  .lst ol{gap:1.8vh}
  .lst li{font-size:clamp(15px,2.3vw,30px);padding-left:clamp(46px,7.6vw,84px)}
  .lst li::before{font-size:clamp(18px,3vw,36px)}
  .fig .art{padding:5vh 4vw 0;align-items:center}
  .fig .art svg{width:100%;height:auto;max-width:100%;max-height:100%}
  .fig .cap{padding:2.6vh 7vw 7vh}
  #src{padding:0 7vw}
  #src h2{font-size:clamp(28px,5.2vw,56px)}
  #src li{font-size:clamp(13px,2vw,24px)}
  #src .nt{font-size:clamp(12px,1.8vw,21px)}
  .num .big b{font-size:clamp(90px,24vw,280px)}
  .num .big span{font-size:clamp(13px,2.2vw,26px)}
  .num .cap{padding:0 8vw 10vh}
  #dots{bottom:2vh}#cnt{font-size:clamp(13px,2vw,24px)}
}
@media (min-aspect-ratio:1/1){
  .num .big b{font-size:clamp(80px,13vw,210px)}
  .num .big span{font-size:clamp(12px,1.1vw,20px)}
}

/* ================= ЕДИНЫЙ ФОН ДЛЯ ВСЕХ СЛАЙДОВ =================
   Схемы больше не на пергаменте: тот же тёмный фон, что и везде. */
.fig{background:radial-gradient(130% 100% at 24% 8%,#17293f,#080e18)!important}
.fig .cap h2{color:var(--gp)!important}
.fig .cap p{color:#e8e2d4!important}
.fig .cr{color:#8fa1b6!important}
.fig .art svg,.fig .art img{border:none!important;box-shadow:none!important}
body.light #cnt,body.light #play,body.light #lang button{color:var(--gp)!important;
  background:rgba(9,17,29,.55)!important;border-color:var(--line)!important}
body.light #dots i{background:rgba(245,238,223,.26)!important}
body.light #dots i.on{background:var(--gl)!important}

/* счётчик не должен перекрывать кнопку паузы */
#cnt{right:auto;left:2.4vw;top:auto;bottom:6.2vh}
@media (max-aspect-ratio:1/1){#cnt{left:5vw;bottom:5.4vh}}


/* ============ АНИМАЦИИ ИНФОГРАФИКИ ============ */
@keyframes a-ping{0%{transform:scale(.5);opacity:.95}70%{transform:scale(2.1);opacity:0}
 100%{transform:scale(2.1);opacity:0}}
.sl.on .a-ping{transform-box:fill-box;transform-origin:50% 50%;
 animation:a-ping 2.4s cubic-bezier(.22,.9,.28,1) infinite both}
@keyframes a-rot{to{transform:rotate(360deg)}}
.sl.on .a-spin{animation:a-rot 46s linear infinite}
.sl.on .a-spin-rev{animation:a-rot 34s linear infinite reverse}
@keyframes a-riseY{from{transform:scaleY(0);opacity:.15}to{transform:scaleY(1);opacity:1}}
.sl.on .a-bar{transform-box:fill-box;transform-origin:50% 100%;
 animation:a-riseY 1s cubic-bezier(.22,.9,.28,1) both}
@keyframes a-growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sl.on .a-grow{transform-box:fill-box;transform-origin:0% 50%;
 animation:a-growX 1.15s cubic-bezier(.22,.9,.28,1) both}
@keyframes a-fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.sl.on .a-up{animation:a-fadeUp .75s var(--e) both}
@keyframes a-dash{to{stroke-dashoffset:0}}
.sl.on .a-draw{animation:a-dash 2.2s var(--e) both}
@keyframes a-popIn{from{opacity:0;transform:scale(.35)}to{opacity:1;transform:none}}
.sl.on .a-pop{transform-box:fill-box;transform-origin:50% 50%;
 animation:a-popIn .7s cubic-bezier(.34,1.4,.5,1) both}
@keyframes a-move{to{stroke-dashoffset:-320}}
.sl.on .a-flow{animation:a-move 7s linear infinite}
@keyframes a-pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.9;transform:scale(1.045)}}
.sl.on .a-glow{transform-box:fill-box;transform-origin:50% 50%;
 animation:a-pulse 3.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
  .sl.on .a-bar,.sl.on .a-grow,.sl.on .a-up,.sl.on .a-draw,.sl.on .a-pop
  {animation-duration:.01s!important;animation-delay:0s!important}
  .sl.on .a-flow,.sl.on .a-glow,.sl.on .a-spin,.sl.on .a-spin-rev,
  .sl.on .a-ping{animation:none!important}
}

/* ============ СЛАЙД ОРГАНИЗАЦИИ ============ */
.org{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
 justify-content:center;text-align:center;padding:0 8vw;
 background:radial-gradient(130% 100% at 50% 14%,#17293f,#080e18)}
.org .plate{background:#fff;border-radius:20px;padding:2.8vh 5vw;margin-bottom:4.4vh;
 border:1px solid rgba(201,151,63,.4);box-shadow:0 2.4vh 8vh rgba(0,0,0,.55);
 display:flex;align-items:center;justify-content:center}
.org .plate img{display:block;width:auto;height:auto;
 max-width:min(620px,62vw);max-height:min(150px,13vh)}
.org .orgtext{display:flex;flex-direction:column;align-items:center}
.org h2{font-family:var(--serif);font-size:clamp(28px,3.4vw,56px);line-height:1.1;
 margin:0 0 16px;color:var(--gp)}
.org p{margin:0;max-width:40em;font-size:clamp(16px,1.4vw,26px);line-height:1.62;color:#e8e2d4}
.org .orgleft{display:flex;flex-direction:column;align-items:center;gap:2.2vh}
.org .ono{font-family:var(--serif);font-size:clamp(15px,1.2vw,22px);letter-spacing:.34em;
 color:var(--g);opacity:.85}
.org .obadge{display:flex;align-items:baseline;gap:.8rem;margin-top:3.4vh;
 padding-top:2.4vh;border-top:1px solid rgba(201,151,63,.3)}
.org .obadge b{font-family:var(--serif);font-weight:700;line-height:1;
 font-size:clamp(38px,3.6vw,68px);color:var(--gl)}
.org .obadge span{font-size:clamp(13px,1.02vw,20px);letter-spacing:.14em;
 text-transform:uppercase;color:var(--dim)}
@keyframes badgeIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.sl.on .org .obadge{animation:badgeIn 1s var(--e) 1.05s both}
.sl.on .org .ono{animation:upS .9s var(--e) 1.2s both}

 background:linear-gradient(90deg,transparent,var(--g),transparent)}
@keyframes plateIn{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}
.sl.on .org .plate{animation:plateIn 1.1s cubic-bezier(.22,.9,.28,1) both}

/* ============ ВИДЕОСЛАЙДЫ ============ */
.vidwrap{position:absolute;inset:0;overflow:hidden;background:#0a1320}

 object-fit:cover;object-position:50% 45%;background:#0a1320}
.vidwrap .veil{position:absolute;inset:0;pointer-events:none;background:
 linear-gradient(180deg,rgba(7,13,24,.74) 0%,rgba(7,13,24,.18) 22%,rgba(7,13,24,.66) 50%,rgba(7,13,24,.99) 100%)}

.vidph{position:absolute;inset:0;z-index:4;display:none;align-items:center;justify-content:center;

.sl.novid .vidph{display:flex}

var TR={"ru": [{"sub": "Информационный киоск · история автомобильных дорог", "t": "Совместные инфраструктурные проекты", "x": "Когда сотрудничество перестаёт быть визитом и становится предприятием: заводы, материалы и техника, сделанные вместе с зарубежным партнёром здесь, в Узбекистане."}, {"era": "26 марта 2019", "big": "2019", "bigsub": "год регистрации СП «Papenburg Uzbekistan»", "t": "Совместное предприятие с немецким партнёром", "x": "Общество с ограниченной ответственностью «PAPENBURG UZBEKISTAN» — совместное предприятие — зарегистрировано 26 марта 2019 года в Бектемирском районе Ташкента. Немецкая Papenburg считается одним из мировых лидеров в производстве асфальтобетонных смесей и в дорожном строительстве.", "cr": "Источники: свидетельство о государственной регистрации; Кадр: специальный репортаж «Узбекистон 24»"}, {"era": "Бектемир, Ташкент", "t": "Завод стоит в черте столицы", "x": "Производственная площадка совместного предприятия работает в Бектемирском районе Ташкента, на улице Порлок. Отсюда асфальтобетонная смесь уходит на объекты — расстояние до места укладки напрямую влияет на температуру смеси и на качество покрытия.", "cr": "Кадр: специальный репортаж «Узбекистон 24»"}, {"era": "Производство", "t": "Смесь по немецким нормам", "x": "Смысл совместного предприятия не в вывеске, а в том, что материал выпускают по стандартам партнёра: рецептура, температурный режим, контроль фракций и лабораторная проверка каждой партии. Такой асфальт ведёт себя предсказуемо и в летнюю жару, и зимой.", "cr": "Кадр: специальный репортаж «Узбекистон 24»"}, {"era": "Что даёт предприятие", "t": "Совместное производство — это не только продукция", "x": "Завод внутри страны меняет не только логистику. Вместе с оборудованием приходят нормы, контроль и люди, которые умеют с этим работать.", "items": ["Материалы по стандартам партнёра", "Короткое плечо доставки смеси", "Лабораторный контроль каждой партии", "Обучение местных специалистов", "Рабочие места в Узбекистане", "Технологии остаются в стране"], "cr": "Источник: Комитет по автомобильным дорогам"}, {"era": "Оборудование", "t": "Линия, привезённая целиком", "x": "Совместное предприятие начинается с оборудования: силосы для битума и минерального порошка, сушильный барабан, смесительная башня, весовые дозаторы. Такую линию нельзя купить по частям — её ставят и настраивают вместе с инженерами партнёра.", "cr": "Кадр: специальный репортаж «Узбекистон 24»"}, {"era": "20 октября 2020", "big": "2020", "bigsub": "год регистрации СП «Avtobelgi Road Marking»", "t": "Второе предприятие: краска для разметки", "x": "Общество «AVTOBELGI ROAD MARKING» — тоже совместное предприятие — зарегистрировано 20 октября 2020 года в Олмазарском районе Ташкента. Оно выпускает дорожные краски, которыми наносят продольную и поперечную разметку на автомобильных дорогах.", "cr": "Источники: свидетельство о государственной регистрации; Комитет по автомобильным дорогам, 23.12.2024"}, {"era": "4 июня 2024", "t": "От завода к подготовке кадров", "x": "Председатель комитета Жамшид Турсунов и руководитель компании господин Гюнтер Папенбург обсудили производство дорожно-строительных материалов по немецким стандартам и выполнение дорожных работ. Отдельная тема — создание учебного центра, который готовил бы специалистов для дорожной отрасли: развитие сферы напрямую зависит от кадров.", "cr": "Источник: Комитет по автомобильным дорогам, 04.06.2024"}, {"era": "Видео", "t": "Предприятие в работе", "x": "Кадры специального репортажа о запуске совместного предприятия.", "cr": "Видео: специальный репортаж «Узбекистон 24»", "vmiss": "Здесь будет видеоролик", "vhint": "Положите файл video/07.mp4 рядом с этой страницей"}, {"era": "8 мая 2024", "t": "Тоннели под дорогами: щит вместо траншеи", "x": "Председатель комитета встретился с руководителем немецкой HERRENKNECHT AG. Завод основан в 1977 году, сегодня в нём около пяти тысяч работников. Он строит транспортные тоннели под автомобильными и железными дорогами и подземные переходы. Такая техника нужна там, где дорогу нельзя перекрыть.", "cr": "Источник: Комитет по автомобильным дорогам, 08.05.2024"}, {"era": "Своё производство", "t": "Кластер, который делает то, что раньше везли", "x": "Государственное учреждение «Узйулкуприк» выпускает около ста видов железобетонных изделий для мостов, путепроводов и тоннелей. С апреля 2024 года здесь начали делать балки длиной тридцать три метра — раньше такие пролёты приходилось закупать.", "cr": "Источник: Комитет по автомобильным дорогам", "svg": "<svg viewBox=\"30 40 940 560\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"500\" y=\"70\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" fill=\"#e3b25e\" font-family=\"Manrope,sans-serif\" letter-spacing=\".14em\" class=\"a-up\" style=\"animation-delay:0.0s\">КЛАСТЕР «УЗЙУЛКУПРИК» В ЦИФРАХ</text><text x=\"500\" y=\"124\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"400\" fill=\"#8fa1b6\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:0.3s\">государственное учреждение · производство для дорог и мостов</text><path d=\"M60,168 h260 v144 h-260 z\" fill=\"#c9973f\" opacity=\".06\" class=\"a-up\" style=\"animation-delay:0.5s\"/><path d=\"M60,168 h260 v144 h-260 z\" fill=\"none\" stroke=\"#c9973f\" stroke-width=\"1.2\" opacity=\".4\" class=\"a-up\" style=\"animation-delay:0.5s\"/><text x=\"190\" y=\"248\" text-anchor=\"middle\" font-size=\"54\" font-weight=\"700\" fill=\"#e3b25e\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:0.62s\">50</text><text x=\"190\" y=\"282\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#f0d9a8\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:0.7s\">управленцев</text><path d=\"M370,168 h260 v144 h-260 z\" fill=\"#c9973f\" opacity=\".06\" class=\"a-up\" style=\"animation-delay:0.66s\"/><path d=\"M370,168 h260 v144 h-260 z\" fill=\"none\" stroke=\"#c9973f\" stroke-width=\"1.2\" opacity=\".4\" class=\"a-up\" style=\"animation-delay:0.66s\"/><text x=\"500\" y=\"248\" text-anchor=\"middle\" font-size=\"54\" font-weight=\"700\" fill=\"#e3b25e\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:0.78s\">110</text><text x=\"500\" y=\"282\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#f0d9a8\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:0.86s\">инженеров и техников</text><path d=\"M680,168 h260 v144 h-260 z\" fill=\"#c9973f\" opacity=\".06\" class=\"a-up\" style=\"animation-delay:0.8200000000000001s\"/><path d=\"M680,168 h260 v144 h-260 z\" fill=\"none\" stroke=\"#c9973f\" stroke-width=\"1.2\" opacity=\".4\" class=\"a-up\" style=\"animation-delay:0.8200000000000001s\"/><text x=\"810\" y=\"248\" text-anchor=\"middle\" font-size=\"54\" font-weight=\"700\" fill=\"#e3b25e\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:0.94s\">470</text><text x=\"810\" y=\"282\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#f0d9a8\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:1.02s\">рабочих</text><path d=\"M60,358 h260 v144 h-260 z\" fill=\"#c9973f\" opacity=\".06\" class=\"a-up\" style=\"animation-delay:0.98s\"/><path d=\"M60,358 h260 v144 h-260 z\" fill=\"none\" stroke=\"#c9973f\" stroke-width=\"1.2\" opacity=\".4\" class=\"a-up\" style=\"animation-delay:0.98s\"/><text x=\"190\" y=\"438\" text-anchor=\"middle\" font-size=\"54\" font-weight=\"700\" fill=\"#e3b25e\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:1.1s\">19</text><text x=\"190\" y=\"472\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#f0d9a8\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:1.18s\">цехов</text><path d=\"M370,358 h260 v144 h-260 z\" fill=\"#c9973f\" opacity=\".06\" class=\"a-up\" style=\"animation-delay:1.1400000000000001s\"/><path d=\"M370,358 h260 v144 h-260 z\" fill=\"none\" stroke=\"#c9973f\" stroke-width=\"1.2\" opacity=\".4\" class=\"a-up\" style=\"animation-delay:1.1400000000000001s\"/><text x=\"500\" y=\"438\" text-anchor=\"middle\" font-size=\"54\" font-weight=\"700\" fill=\"#e3b25e\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:1.26s\">100</text><text x=\"500\" y=\"472\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#f0d9a8\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:1.34s\">видов железобетонных изделий</text><path d=\"M680,358 h260 v144 h-260 z\" fill=\"#c9973f\" opacity=\".06\" class=\"a-up\" style=\"animation-delay:1.3s\"/><path d=\"M680,358 h260 v144 h-260 z\" fill=\"none\" stroke=\"#c9973f\" stroke-width=\"1.2\" opacity=\".4\" class=\"a-up\" style=\"animation-delay:1.3s\"/><text x=\"810\" y=\"438\" text-anchor=\"middle\" font-size=\"54\" font-weight=\"700\" fill=\"#e3b25e\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:1.42s\">33</text><text x=\"810\" y=\"472\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#f0d9a8\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:1.5s\">метра — длина</text><text x=\"810\" y=\"494\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#f0d9a8\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:1.54s\">балки моста</text><text x=\"500\" y=\"580\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"400\" fill=\"#8fa1b6\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:1.9s\">По данным Комитета по автомобильным дорогам</text></svg>"}, {"era": "Техника", "t": "Машины, которые остаются здесь", "x": "Совместное предприятие — это ещё и парк техники, который не уезжает после сдачи объекта. Асфальтоукладчики, катки, самосвалы и лаборатория на колёсах работают в стране постоянно, а обслуживают их местные механики.", "cr": "Кадр: специальный репортаж «Узбекистон 24»"}, {"era": "Смысл", "big": "2", "bigsub": "совместных предприятия в дорожной отрасли", "t": "Партнёрство, которое можно потрогать", "x": "Два зарегистрированных совместных предприятия — асфальтобетонное производство и выпуск дорожных красок — и собственный кластер железобетонных изделий. Это и есть разница между поездкой за опытом и опытом, который перенесён в страну.", "cr": "Источники: свидетельства о государственной регистрации; Источник: Комитет по автомобильным дорогам"}, {"t": "Источники", "items": ["Свидетельство о государственной регистрации СП «PAPENBURG UZBEKISTAN» от 26.03.2019", "Свидетельство о государственной регистрации СП «AVTOBELGI ROAD MARKING» от 20.10.2020", "Специальный репортаж «Узбекистон 24» о запуске совместного предприятия", "Комитет по автомобильным дорогам — сообщения от 08.05.2024, 04.06.2024, 23.12.2024", "Комитет по автомобильным дорогам — сведения о кластере «Узйулкуприк»"], "note": "Раздел посвящён совместным предприятиям и собственному производству в дорожной отрасли. Даты регистрации и адреса приведены по свидетельствам о государственной регистрации юридических лиц. Кадры производственной площадки взяты из специального репортажа телеканала «Узбекистон 24». Показатели кластера приведены по сообщению комитета. Партнёрские банки и организации рассматриваются в разделе «Международные организации и финансовые институты», встречи и поездки — в разделах «Сотрудничество с зарубежными странами» и «Зарубежный опыт»."}], "uz": [{"sub": "Axborot kioski · avtomobil yoʻllari tarixi", "t": "Qoʻshma infratuzilma loyihalari", "x": "Hamkorlik tashrif boʻlishdan toʻxtab, korxonaga aylanganda: xorijiy sherik bilan birga shu yerda, Oʻzbekistonda yaratilgan zavodlar, materiallar va texnika."}, {"era": "2019-yil 26-mart", "big": "2019", "bigsub": "«Papenburg Uzbekistan» QK roʻyxatdan oʻtgan yil", "t": "Nemis sherigi bilan qoʻshma korxona", "x": "«PAPENBURG UZBEKISTAN» mas'uliyati cheklangan jamiyat — qoʻshma korxona — 2019-yil 26-martda Toshkent shahri Bektemir tumanida roʻyxatdan oʻtkazilgan. Germaniyaning «Papenburg» kompaniyasi asfalt-beton qorishmalari ishlab chiqarish va yoʻl qurilishi boʻyicha dunyodagi yetakchilardan biri hisoblanadi.", "cr": "Manbalar: davlat roʻyxatidan oʻtkazilganlik guvohnomasi; Kadr: «Oʻzbekiston 24» maxsus reportaji"}, {"era": "Bektemir, Toshkent", "t": "Zavod poytaxt hududida joylashgan", "x": "Qoʻshma korxonaning ishlab chiqarish maydonchasi Toshkent shahri Bektemir tumanida, Porloq koʻchasida ishlaydi. Bu yerdan asfalt-beton qorishmasi obyektlarga joʻnaydi — yotqizish joyigacha boʻlgan masofa qorishma haroratiga va qoplama sifatiga bevosita taʼsir qiladi.", "cr": "Kadr: «Oʻzbekiston 24» maxsus reportaji"}, {"era": "Ishlab chiqarish", "t": "Nemis meʼyorlari boʻyicha qorishma", "x": "Qoʻshma korxonaning maʼnosi peshlavhada emas, balki materialning sherik standartlari boʻyicha ishlab chiqarilishida: retseptura, harorat rejimi, fraksiyalar nazorati va har bir partiyaning laboratoriya tekshiruvi. Bunday asfalt yozgi jaziramada ham, qishda ham oldindan aytish mumkin boʻlgan tarzda ishlaydi.", "cr": "Kadr: «Oʻzbekiston 24» maxsus reportaji"}, {"era": "Korxona nima beradi", "t": "Qoʻshma ishlab chiqarish — faqat mahsulot emas", "x": "Mamlakat ichidagi zavod faqat logistikani oʻzgartirmaydi. Uskuna bilan birga meʼyorlar, nazorat va ular bilan ishlay oladigan odamlar ham keladi.", "items": ["Sherik standartlari boʻyicha materiallar", "Qorishmani yetkazish masofasi qisqa", "Har bir partiyaning laboratoriya nazorati", "Mahalliy mutaxassislarni oʻqitish", "Oʻzbekistonda ish oʻrinlari", "Texnologiya mamlakatda qoladi"], "cr": "Manba: Avtomobil yoʻllari qoʻmitasi"}, {"era": "Uskuna", "t": "Butunligicha keltirilgan liniya", "x": "Qoʻshma korxona uskunadan boshlanadi: bitum va mineral kukun uchun siloslar, quritish barabani, aralashtirish minorasi, vazn dozatorlari. Bunday liniyani qismlarga boʻlib sotib olib boʻlmaydi — u sherikning muhandislari bilan birga oʻrnatiladi va sozlanadi.", "cr": "Kadr: «Oʻzbekiston 24» maxsus reportaji"}, {"era": "2020-yil 20-oktabr", "big": "2020", "bigsub": "«Avtobelgi Road Marking» QK roʻyxatdan oʻtgan yil", "t": "Ikkinchi korxona: chiziq uchun boʻyoq", "x": "«AVTOBELGI ROAD MARKING» jamiyati — u ham qoʻshma korxona — 2020-yil 20-oktabrda Toshkent shahri Olmazor tumanida roʻyxatdan oʻtkazilgan. U avtomobil yoʻllariga yoʻl-yotiq chiziqlari chizishda ishlatiladigan yoʻl boʻyoqlarini ishlab chiqaradi.", "cr": "Manbalar: davlat roʻyxatidan oʻtkazilganlik guvohnomasi; Avtomobil yoʻllari qoʻmitasi, 23.12.2024"}, {"era": "2024-yil 4-iyun", "t": "Zavoddan kadrlar tayyorlashgacha", "x": "Qoʻmita raisi Jamshid Tursunov va kompaniya rahbari janob Gunter Papenburg nemis standartlari asosida yoʻl qurilishi materiallari ishlab chiqarish hamda yoʻl ishlarini bajarish rejalarini muhokama qildilar. Alohida mavzu — yoʻl xoʻjaligi sohasi uchun mutaxassis tayyorlaydigan markaz tashkil etish: sohaning rivoji bevosita kadrlarga bogʻliq.", "cr": "Manba: Avtomobil yoʻllari qoʻmitasi, 04.06.2024"}, {"era": "Video", "t": "Ishdagi korxona", "x": "Qoʻshma korxona ishga tushirilishi haqidagi maxsus reportaj kadrlari.", "cr": "Video: «Oʻzbekiston 24» maxsus reportaji", "vmiss": "Bu yerga videorolik qoʻyiladi", "vhint": "video/07.mp4 faylini shu sahifa yoniga joylashtiring"}, {"era": "2024-yil 8-may", "t": "Yoʻl ostidagi tonnellar: xandaq emas, qalqon", "x": "Qoʻmita raisi Germaniyaning HERRENKNECHT AG rahbari bilan uchrashdi. Zavodga 1977-yilda asos solingan, bugun unda besh mingga yaqin ishchi bor. U avtomobil va temir yoʻllar ostida transport tonnellari hamda piyodalar oʻtish joylarini quradi. Bunday texnika yoʻlni yopib boʻlmaydigan joylarda kerak.", "cr": "Manba: Avtomobil yoʻllari qoʻmitasi, 08.05.2024"}, {"era": "Oʻz ishlab chiqarishimiz", "t": "Ilgari keltirilgan narsani ishlab chiqaruvchi klaster", "x": "«Oʻzyoʻlkoʻprik» davlat muassasasi koʻpriklar, yoʻl oʻtkazgichlar va tonnellar uchun yuzga yaqin turdagi temir-beton mahsuloti chiqaradi. 2024-yil apreldan bu yerda oʻttiz uch metrli balkalar ishlab chiqarila boshlandi — ilgari bunday oraliqlarni sotib olishga toʻgʻri kelardi.", "cr": "Manba: Avtomobil yoʻllari qoʻmitasi", "svg": "<svg viewBox=\"30 40 940 560\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"500\" y=\"70\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" fill=\"#e3b25e\" font-family=\"Manrope,sans-serif\" letter-spacing=\".14em\" class=\"a-up\" style=\"animation-delay:0.0s\">«OʻZYOʻLKOʻPRIK» KLASTERI RAQAMLARDA</text><text x=\"500\" y=\"124\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"400\" fill=\"#8fa1b6\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:0.3s\">davlat muassasasi · yoʻl va koʻpriklar uchun ishlab chiqarish</text><path d=\"M60,168 h260 v144 h-260 z\" fill=\"#c9973f\" opacity=\".06\" class=\"a-up\" style=\"animation-delay:0.5s\"/><path d=\"M60,168 h260 v144 h-260 z\" fill=\"none\" stroke=\"#c9973f\" stroke-width=\"1.2\" opacity=\".4\" class=\"a-up\" style=\"animation-delay:0.5s\"/><text x=\"190\" y=\"248\" text-anchor=\"middle\" font-size=\"54\" font-weight=\"700\" fill=\"#e3b25e\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:0.62s\">50</text><text x=\"190\" y=\"282\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#f0d9a8\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:0.7s\">boshqaruv xodimi</text><path d=\"M370,168 h260 v144 h-260 z\" fill=\"#c9973f\" opacity=\".06\" class=\"a-up\" style=\"animation-delay:0.66s\"/><path d=\"M370,168 h260 v144 h-260 z\" fill=\"none\" stroke=\"#c9973f\" stroke-width=\"1.2\" opacity=\".4\" clas \".06\" class=\"a-up\" style=\"animation-delay:1.1400000000000001s\"/><path d=\"M370,358 h260 v144 h-260 z\" fill=\"none\" stroke=\"#c9973f\" stroke-width=\"1.2\" opacity=\".4\" class=\"a-up\" style=\"animation-delay:1.1400000000000001s\"/><text x=\"500\" y=\"438\" text-anchor=\"middle\" font-size=\"54\" font-weight=\"700\" fill=\"#e3b25e\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:1.26s\">100</text><text x=\"500\" y=\"472\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#f0d9a8\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:1.34s\">turdagi temir-beton mahsuloti</text><path d=\"M680,358 h260 v144 h-260 z\" fill=\"#c9973f\" opacity=\".06\" class=\"a-up\" style=\"animation-delay:1.3s\"/><path d=\"M680,358 h260 v144 h-260 z\" fill=\"none\" stroke=\"#c9973f\" stroke-width=\"1.2\" opacity=\".4\" class=\"a-up\" style=\"animation-delay:1.3s\"/><text x=\"810\" y=\"438\" text-anchor=\"middle\" font-size=\"54\" font-weight=\"700\" fill=\"#e3b25e\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:1.42s\">33</text><text x=\"810\" y=\"472\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#f0d9a8\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:1.5s\">metrli koʻprik balkasi</text><text x=\"500\" y=\"580\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"400\" fill=\"#8fa1b6\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:1.9s\">Avtomobil yoʻllari qoʻmitasi maʼlumotlari asosida</text></svg>"}, {"era": "Texnika", "t": "Shu yerda qoladigan mashinalar", "x": "Qoʻshma korxona — bu obyekt topshirilgandan keyin ketib qolmaydigan texnika parki hamdir. Asfalt yotqizgichlar, katoklar, oʻzi agʻdargichlar va gʻildirakli laboratoriya mamlakatda doimiy ishlaydi, ularga mahalliy mexaniklar xizmat koʻrsatadi.", "cr": "Kadr: «Oʻzbekiston 24» maxsus reportaji"}, {"era": "Maʼno", "big": "2", "bigsub": "yoʻl tarmogʻidagi qoʻshma korxona", "t": "Qoʻlga oladigan sheriklik", "x": "Roʻyxatdan oʻtgan ikkita qoʻshma korxona — asfalt-beton ishlab chiqarish va yoʻl boʻyoqlari chiqarish — hamda temir-beton mahsulotlarining oʻz klasteri. Tajriba ortidan safar bilan mamlakatga koʻchirilgan tajriba oʻrtasidagi farq ana shu.", "cr": "Manbalar: davlat roʻyxatidan oʻtkazilganlik guvohnomalari; Manba: Avtomobil yoʻllari qoʻmitasi"}, {"t": "Manbalar", "items": ["«PAPENBURG UZBEKISTAN» QK davlat roʻyxatidan oʻtkazilganlik guvohnomasi, 26.03.2019", "«AVTOBELGI ROAD MARKING» QK davlat roʻyxatidan oʻtkazilganlik guvohnomasi, 20.10.2020", "Qoʻshma korxona ishga tushirilishi haqidagi «Oʻzbekiston 24» maxsus reportaji", "Avtomobil yoʻllari qoʻmitasi — 08.05.2024, 04.06.2024, 23.12.2024 xabarlari", "Avtomobil yoʻllari qoʻmitasi — «Oʻzyoʻlkoʻprik» klasteri maʼlumotlari"], "note": "Boʻlim qoʻshma korxonalar va yoʻl tarmogʻidagi oʻz ishlab chiqarishga bagʻishlangan. Roʻyxatdan oʻtish sanalari va manzillar yuridik shaxslarni davlat roʻyxatidan oʻtkazilganlik guvohnomalari boʻyicha keltirilgan. Ishlab chiqarish maydonchasi kadrlari «Oʻzbekiston 24» telekanalining maxsus reportajidan olingan. Klaster koʻrsatkichlari qoʻmita xabari boʻyicha berilgan. Sherik banklar va tashkilotlar «Xalqaro tashkilotlar va moliya institutlari» boʻlimida, uchrashuv va safarlar «Chet el davlatlari bilan hamkorlik» hamda «Xorijiy tajribalar» boʻlimlarida koʻrib chiqiladi."}], "en": [{"sub": "Information kiosk · history of the road network", "t": "Joint infrastructure projects", "x": "When cooperation stops being a visit and becomes an enterprise: plants, materials and machinery made together with a foreign partner here in Uzbekistan."}, {"era": "26 March 2019", "big": "2019", "bigsub": "the year Papenburg Uzbekistan was registered", "t": "A joint venture with a German partner", "x": "The limited liability company PAPENBURG UZBEKISTAN — a joint venture — was registered on 26 March 2019 in the Bektemir district of Tashkent. Germany's Papenburg is considered one of the world leaders in producing asphalt concrete mixes and in road construction.", "cr": "Sources: certificate of state registration; Still: special report, Uzbekistan 24"}, {"era": "Bektemir, Tashkent", "t": "The plant stands inside the capital", "x": "The joint venture's production site operates in the Bektemir district of Tashkent, on Porloq street. From here the asphalt concrete mix travels to the sites — the distance to the laying point directly affects the temperature of the mix and the quality of the pavement.", "cr": "Still: special report, Uzbekistan 24"}, {"era": "Production", "t": "A mix to German norms", "x": "The point of a joint venture is not the sign on the building but that the material is produced to the partner's standards: recipe, temperature regime, control of fractions and laboratory testing of every batch. Such asphalt behaves predictably in summer heat and in winter alike.", "cr": "Still: special report, Uzbekistan 24"}, {"era": "What the plant brings", "t": "Joint production is more than a product", "x": "A plant inside the country changes more than logistics. Along with the equipment come norms, controls and people who know how to work with them.", "items": ["Materials to the partner's standards", "A short haul for the mix", "Laboratory control of every batch", "Training for local specialists", "Jobs in Uzbekistan", "The technology stays in the country"], "cr": "Source: the Committee for Roads"}, {"era": "Equipment", "t": "A line brought in as a whole", "x": "A joint venture begins with equipment: silos for bitumen and mineral filler, a drying drum, a mixing tower, weighing dosers. Such a line cannot be bought in pieces — it is installed and commissioned together with the partner's engineers.", "cr": "Still: special report, Uzbekistan 24"}, {"era": "20 October 2020", "big": "2020", "bigsub": "the year Avtobelgi Road Marking was registered", "t": "A second venture: paint for road marking", "x": "AVTOBELGI ROAD MARKING — also a joint venture — was registered on 20 October 2020 in the Olmazor district of Tashkent. It produces the road paints used for longitudinal and transverse markings on the highways.", "cr": "Sources: certificate of state registration; the Committee for Roads, 23.12.2024"}, {"era": "4 June 2024", "t": "From the plant to training people", "x": "Committee chairman Jamshid Tursunov and the company's head, Mr Günter Papenburg, discussed producing road construction materials to German standards and carrying out road works. A separate subject was setting up a training centre for the road sector: the industry's development depends directly on qualified people.", "cr": "Source: the Committee for Roads, 04.06.2024"}, {"era": "Video", "t": "The plant at work", "x": "Footage from a special report on the launch of the joint venture.", "cr": "Video: special report, Uzbekistan 24", "vmiss": "A video clip goes here", "vhint": "Put the file video/07.mp4 next to this page"}, {"era": "8 May 2024", "t": "Tunnels under roads: a shield instead of a trench", "x": "The committee chairman met the head of Germany's HERRENKNECHT AG. Founded in 1977, the plant today employs around five thousand people. It builds transport tunnels under roads and railways and pedestrian underpasses. Such equipment is needed where a road cannot be closed.", "cr": "Source: the Committee for Roads, 08.05.2024"}, {"era": "Our own production", "t": "A cluster making what used to be imported", "x": "The Uzyulkuprik state institution produces about a hundred types of reinforced concrete products for bridges, overpasses and tunnels. Since April 2024 it has been making thirty-three-metre beams — spans that previously had to be bought in.", "cr": "Source: the Committee for Roads", "svg": "<svg viewBox=\"30 40 940 560\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"500\" y=\"70\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" fill=\"#e3b25e\" font-family=\"Manrope,sans-serif\" letter-spacing=\".14em\" class=\"a-up\" style=\"animation-delay:0.0s\">THE UZYULKUPRIK CLUSTER IN FIGURES</text><text x=\"500\" y=\"124\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"400\" fill=\"#8fa1b6\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:0.3s\">a state institution · production for roads and bridges</text><path d=\"M60,168 h260 v144 h-260 z\" fill=\"#c9973f\" opacity=\".06\" class=\"a-up\" style=\"animation-delay:0.5s\"/><path d=\"M60,168 h260 v144 h-260 z\" fill=\"none\" stroke=\"#c9973f\" stroke-width=\"1.2\" opacity=\".4\" class=\"a-up\" style=\"animation-delay:0.5s\"/><text x=\"190\" y=\"248\" text-anchor=\"middle\" font-size=\"54\" font-weight=\"700\" fill=\"#e3b25e\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:0.62s\">50</text><text x=\"190\" y=\"282\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#f0d9a8\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:0.7s\">managers</text><path d=\"M370,168 h260 v144 h-260 z\" fill=\"#c9973f\" opacity=\".06\" class=\"a-up\" style=\"animation-delay:0.66s\"/><path d=\"M370,168 h260 v144 h-260 z\" fill=\"none\" stroke=\"#c9973f\" stroke-width=\"1.2\" opacity=\".4\" class=\"a-up\" style=\"animation-delay:0.66s\"/><text x=\"500\" y=\"248\" text-anchor=\"middle\" font-size=\"54\" font-weight=\"700\" fill=\"#e3b25e\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:0.78s\">110</text><text x=\"500\" y=\"282\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#f0d9a8\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:0.86s\">engineers and technicians</text><path d=\"M680,168 h260 v144 h-260 z\" fill=\"#c9973f\" opacity=\".06\" class=\"a-up\" style=\"animation-delay:0.8200000000000001s\"/><path d=\"M680,168 h260 v144 h-260 z\" fill=\"none\" stroke=\"#c9973f\" stroke-width=\"1.2\" opacity=\".4\" class=\"a-up\" style=\"animation-delay:0.8200000000000001s\"/><text x=\"810\" y=\"248\" text-anchor=\"middle\" font-size=\"54\" font-weight=\"700\" fill=\"#e3b25e\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:0.94s\">470</text><text x=\"810\" y=\"282\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#f0d9a8\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:1.02s\">workers</text><path d=\"M60,358 h260 v144 h-260 z\" fill=\"#c9973f\" opacity=\".06\" class=\"a-up\" style=\"animation-delay:0.98s\"/><path d=\"M60,358 h260 v144 h-260 z\" fill=\"none\" stroke=\"#c9973f\" stroke-width=\"1.2\" opacity=\".4\" class=\"a-up\" style=\"animation-delay:0.98s\"/><text x=\"190\" y=\"438\" text-anchor=\"middle\" font-size=\"54\" font-weight=\"700\" fill=\"#e3b25e\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:1.1s\">19</text><text x=\"190\" y=\"472\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#f0d9a8\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:1.18s\">workshops</text><path d=\"M370,358 h260 v144 h-260 z\" fill=\"#c9973f\" opacity=\".06\" class=\"a-up\" style=\"animation-delay:1.1400000000000001s\"/><path d=\"M370,358 h260 v144 h-260 z\" fill=\"none\" stroke=\"#c9973f\" stroke-width=\"1.2\" opacity=\".4\" class=\"a-up\" style=\"animation-delay:1.1400000000000001s\"/><text x=\"500\" y=\"438\" text-anchor=\"middle\" font-size=\"54\" font-weight=\"700\" fill=\"#e3b25e\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:1.26s\">100</text><text x=\"500\" y=\"472\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#f0d9a8\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:1.34s\">types of reinforced</text><text x=\"500\" y=\"494\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#f0d9a8\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:1.38s\">concrete products</text><path d=\"M680,358 h260 v144 h-260 z\" fill=\"#c9973f\" opacity=\".06\" class=\"a-up\" style=\"animation-delay:1.3s\"/><path d=\"M680,358 h260 v144 h-260 z\" fill=\"none\" stroke=\"#c9973f\" stroke-width=\"1.2\" opacity=\".4\" class=\"a-up\" style=\"animation-delay:1.3s\"/><text x=\"810\" y=\"438\" text-anchor=\"middle\" font-size=\"54\" font-weight=\"700\" fill=\"#e3b25e\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:1.42s\">33</text><text x=\"810\" y=\"472\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#f0d9a8\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:1.5s\">metres — bridge</text><text x=\"810\" y=\"494\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#f0d9a8\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:1.54s\">beam length</text><text x=\"500\" y=\"580\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"400\" fill=\"#8fa1b6\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:1.9s\">Data of the Committee for Roads</text></svg>"}, {"era": "Machinery", "t": "Machines that stay here", "x": "A joint venture also means a fleet that does not leave once the site is handed over. Pavers, rollers, tippers and a laboratory on wheels work in the country permanently, and local mechanics service them.", "cr": "Still: special report, Uzbekistan 24"}, {"era": "The point", "big": "2", "bigsub": "joint ventures in the road sector", "t": "A partnership you can touch", "x": "Two registered joint ventures — asphalt concrete production and road paint manufacture — plus the country's own cluster of reinforced concrete products. This is the difference between travelling for experience and experience moved into the country.", "cr": "Sources: certificates of state registration; Source: the Committee for Roads"}, {"t": "Sources", "items": ["Certificate of state registration of PAPENBURG UZBEKISTAN, 26.03.2019", "Certificate of state registration of AVTOBELGI ROAD MARKING, 20.10.2020", "Special report by Uzbekistan 24 on the launch of the joint venture", "Committee for Roads — reports of 08.05.2024, 04.06.2024 and 23.12.2024", "Committee for Roads — data on the Uzyulkuprik cluster"], "note": "This section covers joint ventures and domestic production in the road sector. Registration dates and addresses follow the certificates of state registration of legal entities. Footage of the production site comes from a special report by the Uzbekistan 24 television channel. Cluster figures follow the committee's report. Partner banks and organisations are covered in “International organisations and financial institutions”, and meetings and trips in “Cooperation with foreign countries” and “Foreign experience”."}]};

  bp.frequency.exponentialRampToValueAtTime(dir>0?2100:470,t+0.26);
  var g=c.createGain();

  g.gain.linearRampToValueAtTime(0.07,t+0.03);
  g.gain.exponentialRampToValueAtTime(0.0008,t+0.30);
  s.connect(bp); bp.connect(g); g.connect(c.destination);
  s.start(t); s.stop(t+0.34);
  var o=c.createOscillator(), og=c.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(dir>0?96:78,t);
  o.frequency.exponentialRampToValueAtTime(dir>0?64:52,t+0.16);
  og.gain.setValueAtTime(0.0001,t);
  og.gain.linearRampToValueAtTime(0.045,t+0.02);
  og.gain.exponentialRampToValueAtTime(0.0006,t+0.20);
  o.connect(og); og.connect(c.destination); o.start(t); o.stop(t+0.22);
}

function sndTap(){

/* переход к слайду по воле человека: со звуком и с паузой автопоказа */
function nav(k){ sndSwipe(k>i?1:-1); go(k); pause(); }

function dur(){ return +sl[i].dataset.d || 10000; }
function runBar(ms){
  bar.style.transition='none'; bar.style.width='0%';
  void bar.offsetWidth;
  bar.style.transition='width '+ms+'ms linear'; bar.style.width='100%';
}
function freezeBar(){
  var wpx=bar.getBoundingClientRect().width;
  bar.style.transition='none'; bar.style.width=(wpx/innerWidth*100)+'%';
}
function schedule(ms){
  clearTimeout(tid); t0=Date.now(); left=ms;
  runBar(ms);
  tid=setTimeout(function(){ go(i+1); }, ms);
}
function go(k){
  var prev=i;
  i=(k+n)%n;
  sl.forEach(function(s,x){
    s.classList.remove('out');
    if(x===prev && x!==i) s.classList.add('out');
    s.classList.toggle('on', x===i);
  });
  setTimeout(function(){ sl[prev] && sl[prev].classList.remove('out'); }, 1200);
  di.forEach(function(d,x){ d.classList.toggle('on', x===i); });
  cnt.textContent=(i+1)+' / '+n;
  document.body.classList.toggle('light', sl[i].dataset.light==='1');
  if(playing) schedule(dur()); else { bar.style.transition='none'; bar.style.width='0%'; }
}
function pause(){
  if(!playing) return;
  playing=false; clearTimeout(tid);
  left=Math.max(0, left-(Date.now()-t0));
  freezeBar();
  document.getElementById('pi').innerHTML=PL;
}
function resume(){
  if(playing) return;
  playing=true;
  document.getElementById('pi').innerHTML=PI;
  schedule(left>800? left : dur());
}

/* ---------- звук анимаций: синтез, без аудиофайлов ---------- */
function _env(g,t,peak,atk,rel){
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(peak,t+atk);
  g.gain.exponentialRampToValueAtTime(0.0006,t+rel);
}
/* мягкий гонг — титул и крупные числа */
function sndGong(){
  var c=ac(); if(!c) return; var t=c.currentTime;
  [174,262,392].forEach(function(f,i){
    var o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.setValueAtTime(f,t);
    _env(g,t+i*0.06,0.05-i*0.011,0.05,1.5);
    o.connect(g); g.connect(c.destination); o.start(t+i*0.06); o.stop(t+i*0.06+1.7);
  });
}
/* лёгкий щелчок затвора — фотослайд */
function sndShutter(){
  var c=ac(); if(!c) return; var t=c.currentTime;
  var s=c.createBufferSource(); s.buffer=noiseBuf(c);
  var bp=c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=2.2;
  bp.frequency.setValueAtTime(2600,t);
  bp.frequency.exponentialRampToValueAtTime(900,t+0.09);
  var g=c.createGain(); _env(g,t,0.055,0.004,0.11);
  s.connect(bp); bp.connect(g); g.connect(c.destination); s.start(t); s.stop(t+0.13);
}
/* тихий чертёжный штрих — схемы */
function sndDraw(){
  var c=ac(); if(!c) return; var t=c.currentTime;
  var s=c.createBufferSource(); s.buffer=noiseBuf(c);
  var bp=c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.1;
  bp.frequency.setValueAtTime(700,t);
  bp.frequency.exponentialRampToValueAtTime(2400,t+0.42);
  var g=c.createGain(); _env(g,t,0.035,0.05,0.5);
  s.connect(bp); bp.connect(g); g.connect(c.destination); s.start(t); s.stop(t+0.55);
}
/* короткие отметки — пункты списка выходят по очереди */
function sndTick(i){
  var c=ac(); if(!c) return; var t=c.currentTime+0.55+i*0.18;
  var o=c.createOscillator(), g=c.createGain();
  o.type='triangle';
  o.frequency.setValueAtTime(660+i*38,t);
  _env(g,t,0.022,0.006,0.09);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+0.11);
}
function slideSound(sec){
  if(!SND) return;
  if(sec.querySelector('.ti')||sec.querySelector('.num')) sndGong();
  else if(sec.querySelector('.vis.portal')) sndShutter();
  else if(sec.querySelector('.fig')) sndDraw();
  else if(sec.querySelector('.lst')||sec.querySelector('#src')){
    var n=Math.min(6, sec.querySelectorAll('li').length);
    for(var k=0;k<n;k++) sndTick(k);
  }
}

/* ============ анимированный счёт чисел ============ */
(function(){
"use strict";
function parts(txt){
  var m=/-?[\d][\d\s.,\u00a0]*/.exec(txt);
  if(!m) return null;
  var body=m[0].replace(/[\s\u00a0]+$/,'');
  var pre=txt.slice(0,m.index), post=txt.slice(m.index+body.length);
  var dot=body.lastIndexOf('.'), com=body.lastIndexOf(',');
  var decSep=null, decLen=0;
  var last=Math.max(dot,com);
  if(last>-1 && body.length-last-1<=2 && body.length-last-1>0){
    decSep=body[last]; decLen=body.length-last-1;
  }
  var grp=' ';
  var intPart=decSep? body.slice(0,last) : body;
  var g=/[\s\u00a0.,]/.exec(intPart);
  if(g) grp=g[0]==='\u00a0'?' ':g[0];
  var num=parseFloat(intPart.replace(/[\s\u00a0.,]/g,'')+(decSep?'.'+body.slice(last+1):''));
  var grouped=/[\s\u00a0.,]/.test(intPart);
  return {pre:pre,post:post,num:num,decSep:decSep,decLen:decLen,grp:grp,grouped:grouped};
}
function fmt(p,v){
  var s=p.decLen? v.toFixed(p.decLen) : Math.round(v).toString();
  var ip=p.decLen? s.slice(0,s.indexOf('.')) : s;
  var fp=p.decLen? s.slice(s.indexOf('.')+1) : '';
  if(p.grouped) ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,p.grp);
  return p.pre+ip+(p.decLen? p.decSep+fp : '')+p.post;
}
var running=new WeakMap();
function run(el){
  var full=el.dataset.full;
  if(full===undefined){ full=el.textContent.trim(); }
  el.dataset.full=full;
  var p=parts(full);
  if(!p||!isFinite(p.num)){ el.textContent=full; return; }
  var isYear=(!p.decLen && p.num>1500 && p.num<2200 && !p.grouped);
  var from=isYear? p.num-26 : 0;
  var dur=isYear? 1100 : 1500, t0=null;
  var id={}; running.set(el,id);
  function step(ts){
    if(running.get(el)!==id) return;
    if(t0===null) t0=ts;
    var k=Math.min(1,(ts-t0)/dur);
    var e=1-Math.pow(1-k,3);
    el.textContent=fmt(p, from+(p.num-from)*e);
    if(k<1) requestAnimationFrame(step); else el.textContent=full;
  }
  el.textContent=fmt(p,from);
  requestAnimationFrame(step);
}

      sec.dataset.counted='1';

    } else {
      sec.dataset.counted='';
      [].forEach.call(els,function(el){
        running.set(el,{});
        if(el.dataset.full!==undefined) el.textContent=el.dataset.full;
      });
    }
  });
}

<script>
/* кнопки листания: используют уже существующую навигацию слайдера
   и возвращают автопрокрутку (кнопка play скрыта) */
(function(){
  var deck=document.getElementById('deck');
  function key(k){ dispatchEvent(new KeyboardEvent('keydown',{key:k,bubbles:true})); }
  function keepPlaying(){
    setTimeout(function(){
      if(document.querySelector('#pi path')) key(' ');   /* сейчас пауза — снова запускаем */
    },80);
  }
  document.getElementById('prevb').addEventListener('click',function(e){
    e.stopPropagation(); key('ArrowLeft'); keepPlaying();
  });
  document.getElementById('nextb').addEventListener('click',function(e){
    e.stopPropagation(); key('ArrowRight'); keepPlaying();
  });
  if(deck) deck.addEventListener('click',keepPlaying);   /* тап по слайду тоже не «замораживает» показ */
})();
</script>
<script>
/* ---- звук нажатия для всех кликов: синтез WebAudio, без аудиофайлов (работает офлайн) ---- */
(function(){
  var on = true;
  try{ on = new URLSearchParams(location.search).get('sound') !== 'off'; }catch(e){}
  var ac = null;
  function ctx(){
    try{
      if(!ac){ var A = window.AudioContext || window.webkitAudioContext; if(!A) return null; ac = new A(); }
      if(ac.state === 'suspended') ac.resume();
    }catch(e){ return null; }
    return ac;
  }
  function tick(){
    if(!on) return;
    var c = ctx(); if(!c) return;
    try{
      var t = c.currentTime;
      var o = c.createOscillator(), g = c.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(1500, t);
      o.frequency.exponentialRampToValueAtTime(620, t + 0.06);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.13, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0004, t + 0.13);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + 0.15);
    }catch(e){}
  }
  window.tpClick = tick;
  document.addEventListener('pointerdown', tick, true);
  document.addEventListener('keydown', function(e){ if(e.key === ' ' || e.key === 'Enter') tick(); }, true);
})();
</script>

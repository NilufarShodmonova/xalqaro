 box-shadow:0 1.8vh 5.5vh rgba(0,0,0,.6);
 transition:transform .28s var(--e),border-color .28s,box-shadow .28s}
.gtiles[data-n="1"] .gtile{width:min(60vw,92vh)}
.gtiles[data-n="2"] .gtile{width:min(43vw,92vh)}
.gtile:hover{transform:translateY(-.8vh) scale(1.015);border-color:var(--gl);
 box-shadow:0 2.6vh 7vh rgba(0,0,0,.7)}
.gtile:active{transform:scale(.985)}
.gtile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
 object-position:50% 45%;background:#0a1320;pointer-events:none}
.gtile .gveil{position:absolute;inset:0;
 background:linear-gradient(180deg,rgba(7,13,24,.18) 0%,rgba(7,13,24,.06) 45%,rgba(7,13,24,.86) 100%)}
.gtile .gplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 width:clamp(52px,4.4vw,86px);height:clamp(52px,4.4vw,86px);border-radius:50%;
 border:2px solid var(--gl);background:rgba(9,17,29,.45);
 display:flex;align-items:center;justify-content:center;
 -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
 transition:background .28s,transform .28s var(--e)}
.gtile:hover .gplay{background:rgba(201,151,63,.3);transform:translate(-50%,-50%) scale(1.08)}
.gtile .gplay svg{width:42%;height:42%;fill:var(--gp);margin-left:9%}
.gtile .gnum{position:absolute;left:0;right:0;bottom:0;padding:1.4vh 1.2vw;
 font-family:var(--serif);font-size:clamp(15px,1.25vw,25px);letter-spacing:.1em;
 color:var(--gp);text-align:left}
.gtile .gdur{position:absolute;right:.9vw;top:.9vw;padding:.28em .7em;border-radius:999px;
 font-size:clamp(11px,.8vw,15px);letter-spacing:.08em;color:var(--gp);
 background:rgba(7,13,24,.66);border:1px solid rgba(201,151,63,.4)}
@keyframes gtin{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:none}}
.vidgal.sl.on .gtile{animation:gtin .9s var(--e) both}
.vidgal.sl.on .gtile:nth-child(2){animation-delay:.12s}
.vidgal.sl.on .gtile:nth-child(3){animation-delay:.24s}

@media (max-aspect-ratio:1/1){
  .vidgal .galwrap{gap:2.4vh}
  .vidgal .galhead h2{font-size:clamp(24px,4.6vw,46px)}
  .vidgal .galhead p{font-size:clamp(14px,2vw,26px)}
  .gtiles{flex-direction:column;gap:2.4vh}
  .gtile,.gtiles[data-n="1"] .gtile,.gtiles[data-n="2"] .gtile{width:min(80vw,42vh)}
  .gtiles[data-n="1"] .gtile{width:min(86vw,49vh)}
  .gtile .gnum{font-size:clamp(15px,2.4vw,26px);padding:1.6vh 4vw}
}

/* ================= ОДИНОЧНАЯ СТРАНИЦА ВИДЕО ================= */
#vpage{position:fixed;inset:0;z-index:200;display:none;
 flex-direction:column;align-items:center;justify-content:center;gap:2.6vh;
 padding:4vh 4vw;background:radial-gradient(130% 100% at 50% 10%,#101f38,#05090f)}
#vpage.on{display:flex;animation:vpin .45s var(--e) both}
@keyframes vpin{from{opacity:0}to{opacity:1}}
#vpage .vp-title{font-family:var(--serif);font-size:clamp(18px,1.7vw,34px);
 letter-spacing:.12em;color:var(--gp);text-align:center}
#vpage .vp-stage{flex:0 1 auto;display:flex;align-items:center;justify-content:center;
 width:100%;min-height:0}
#vpage video{width:92vw;height:66vh;display:block;object-fit:contain;
 background:transparent;border:0;outline:none}
#vpback{display:flex;align-items:center;gap:.7rem;cursor:pointer;
 height:clamp(48px,3.8vw,66px);padding:0 1.9rem;border-radius:999px;
 border:1.5px solid var(--line);background:rgba(10,19,32,.7);color:var(--gp);
 font-family:inherit;font-size:clamp(12px,.9vw,17px);letter-spacing:.2em;text-transform:uppercase;
 -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
 transition:border-color .25s,background .25s,transform .18s}
#vpback:hover{border-color:var(--g);background:rgba(201,151,63,.16)}
#vpback:focus{outline:none}
#vpback:focus-visible{outline:2px solid var(--gl);outline-offset:3px}
#vpback:active{transform:scale(.94)}
#vpback svg{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2.2;
 stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
@media (max-aspect-ratio:1/1){
  #vpage video{width:94vw;height:52vh}
  #vpback{font-size:clamp(13px,2vw,20px);height:clamp(52px,7vw,68px);padding:0 2.2rem}
}
</style>

<div id="vpage" aria-hidden="true">
  <div class="vp-title" id="vp-title"></div>
  <div class="vp-stage"><video id="vp-video" playsinline controls preload="auto"></video></div>
  <button id="vpback" type="button"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span id="vpback-t">BACK</span></button>
</div>

<script>
/* ---- видеогалерея: плитки видео + отдельная страница просмотра ---- */
(function(){
"use strict";
var GAL = ["video/5/%D0%9C%D0%B0%D1%85%D1%81%D1%83%D1%81_%D1%80%D0%B5%D0%BF%D0%BE%D1%80%D1%82%D0%B0%D0%B6_%C2%AB%D0%9F%D0%B0%D0%BF%D0%B5%D0%BD%D0%B1%D1%83%D1%80%D0%B3_%D0%A3%CC%86%D0%B7%D0%B1%D0%B5%D0%BA%D0%B8%D1%81%D1%82%D0%BE%D0%BD%C2%BB_%D2%9B%D1%83%CC%86%D1%88%D0%BC%D0%B0_%D0%BA%D0%BE%D1%80%D1%85%D0%BE%D0%BD%D0%B0%D1%81%D0%B8_%D0%B8%D1%88%D0%B3%D0%B0_%D1%82%D1%83%D1%88%D0%B8%D1%80%D0%B8%D0%BB%D0%B4%D0%B8.mp4"];
var box = document.querySelector('.vidgal .gtiles');
if(!box) return;

var T={
  vid:{uz:'Video',ru:'Видео',en:'Video'},
  hint:{uz:'Ko‘rish uchun videoni bosing',
        ru:'Нажмите на видео, чтобы открыть',
        en:'Tap a video to play'},
  back:{uz:'ORQAGA',ru:'НАЗАД',en:'BACK'}
};
function lang(){
  var l=null;
  try{ l=new URLSearchParams(location.search).get('lang'); }catch(e){}
  if(l!=='uz'&&l!=='ru'&&l!=='en'){ l=null; try{ l=localStorage.getItem('bipLang'); }catch(e){} }
  var b=document.querySelector('#lang button.on');
  if(b&&b.dataset.l) l=b.dataset.l;
  return (l==='uz'||l==='ru'||l==='en')?l:'uz';
}
function mmss(s){
  if(!isFinite(s)||s<1) return '';
  var m=Math.floor(s/60), r=Math.round(s%60);
  if(r===60){m++;r=0;}
  return m+':'+(r<10?'0':'')+r;
}

/* ---------- плитки ---------- */
var PLAY='<svg viewBox="0 0 24 24"><path d="M9 6.2l9.4 5.8L9 17.8z"/></svg>';
box.setAttribute('data-n', GAL.length);
GAL.forEach(function(src,k){
  var b=document.createElement('button');
  b.type='button'; b.className='gtile'; b.setAttribute('data-k',k);
  b.innerHTML='<video class="gv" muted playsinline preload="metadata" src="'+src+'#t=0.5"></video>'+
              '<span class="gveil"></span><span class="gplay">'+PLAY+'</span>'+
              '<span class="gdur"></span><span class="gnum"></span>';
  var v=b.querySelector('video'), du=b.querySelector('.gdur');
  du.style.display='none';
  v.addEventListener('loadedmetadata',function(){
    var t=mmss(v.duration);
    if(t){ du.textContent=t; du.style.display=''; }
  });
  b.addEventListener('click',function(e){ e.stopPropagation(); open(k); });
  box.appendChild(b);
});
/* тап по пустому месту этого слайда не листает — чтобы не промахнуться мимо плитки */
var galsec=box.closest('.sl');
if(galsec) galsec.addEventListener('click',function(e){ e.stopPropagation(); });

/* ---------- страница одного видео ---------- */
var page=document.getElementById('vpage');
var vid=document.getElementById('vp-video');
var ttl=document.getElementById('vp-title');
var back=document.getElementById('vpback');
var cur=-1, keep=null;

function labels(){
  var L=lang();
  [].forEach.call(box.querySelectorAll('.gtile'),function(b,k){
    b.querySelector('.gnum').textContent=T.vid[L]+' '+(k+1);
  });
  var h=document.querySelector('.vidgal .galhint');
  if(h) h.textContent=T.hint[L];
  document.getElementById('vpback-t').textContent=T.back[L];
  if(cur>=0) ttl.textContent=T.vid[L]+' '+(cur+1)+' / '+GAL.length;
}
labels();
[].forEach.call(document.querySelectorAll('#lang button'),function(b){
  b.addEventListener('click',function(){ setTimeout(labels,40); });
});

function deckPaused(){ return !!document.querySelector('#pi path'); }
function deckToggle(){ dispatchEvent(new KeyboardEvent('keydown',{key:' ',bubbles:true})); }

function open(k){
  cur=k;
  if(!deckPaused()) deckToggle();          /* показ слайдов встаёт на паузу */
  ttl.textContent=T.vid[lang()]+' '+(k+1)+' / '+GAL.length;
  vid.src=GAL[k];
  page.classList.add('on');
  page.setAttribute('aria-hidden','false');
  vid.muted=false;
  var p=vid.play();
  if(p&&p.catch) p.catch(function(){ vid.muted=true; var q=vid.play(); if(q&&q.catch) q.catch(function(){}); });
  clearInterval(keep);                      /* пока идёт видео — киоск не считает это простоем */
  keep=setInterval(function(){ document.dispatchEvent(new Event('pointermove')); },45000);
  if(back.focus) back.focus({preventScroll:true});
}
function close(){
  clearInterval(keep); keep=null;
  try{ vid.pause(); }catch(e){}
  vid.removeAttribute('src'); vid.load();
  page.classList.remove('on');
  page.setAttribute('aria-hidden','true');
  cur=-1;
  if(deckPaused()) deckToggle();            /* возвращаемся к слайду с видео */
}
back.addEventListener('click',function(e){ e.stopPropagation(); close(); });
page.addEventListener('click',function(e){ e.stopPropagation(); });

/* пока открыто видео — стрелки и пробел не листают слайды */
addEventListener('keydown',function(e){
  if(!page.classList.contains('on')) return;
  if(e.key==='Escape'){ close(); return; }
  if(e.key===' '||e.key==='ArrowLeft'||e.key==='ArrowRight'||
     e.key==='PageUp'||e.key==='PageDown'||e.key==='Home'||e.key==='End'){
    e.stopPropagation();
  }
},true);
})();
</script>

</body>
</html>

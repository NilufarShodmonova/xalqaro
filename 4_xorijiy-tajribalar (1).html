<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Xorijiy tajribalar · Зарубежный опыт · Foreign experience</title>
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#070d18}
body{font-family:"Manrope","Segoe UI",Helvetica,Arial,sans-serif;color:#f5eedf;user-select:none}
:root{--g:#c9973f;--gl:#e3b25e;--gp:#f0d9a8;--dim:#a7b8cd;--line:rgba(201,151,63,.32);
 --ink:#40301a;--ink2:#5b492f;
 --serif:"Cormorant Garamond","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
 --e:cubic-bezier(.22,.9,.28,1)}
#deck{position:fixed;inset:0;perspective:1600px}

/* ---------- слайд: вход и выход ---------- */
.sl{position:absolute;inset:0;opacity:0;visibility:hidden;
 transition:opacity .9s var(--e), visibility .9s, transform 1.1s var(--e);
 transform:scale(1.015)}
.sl.on{opacity:1;visibility:visible;transform:none;z-index:2}
.sl.out{opacity:0;transform:scale(.985);z-index:1}

/* ---------- фотослайды: медленное движение кадра ---------- */
.vis{position:absolute;inset:0;overflow:hidden;background:#0a1320}
.vis img{width:100%;height:100%;display:block;transform-origin:50% 45%}
.vis.cover img{object-fit:cover;object-position:50% 45%}
.vis.contain img{object-fit:contain;padding:5vh 5vw 27vh}
.vis.contain{background:radial-gradient(120% 100% at 50% 18%,#16283f,#080e18)}
@keyframes kb-in{from{transform:scale(1.005) translate3d(0,0,0)}to{transform:scale(1.10) translate3d(-1.2%,-1%,0)}}
@keyframes kb-out{from{transform:scale(1.10) translate3d(1%,-.8%,0)}to{transform:scale(1.005) translate3d(0,0,0)}}
.sl.on .vis.cover img{animation:kb-in 15s linear both}
.sl.on .vis.cover.alt img{animation:kb-out 15s linear both}
@keyframes soft{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
.sl.on .vis.contain img{animation:soft 1.5s var(--e) both}
.scrim{position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(180deg,rgba(7,13,24,.62) 0%,rgba(7,13,24,.10) 22%,rgba(7,13,24,.52) 56%,rgba(7,13,24,.96) 100%)}

/* ---------- подписи ---------- */
@keyframes up{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
@keyframes upS{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes grow{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:none}}
@keyframes track{from{opacity:0;letter-spacing:.9em}to{opacity:1;letter-spacing:.42em}}
.cap{position:absolute;left:0;right:0;bottom:0;padding:0 7vw 8vh;z-index:3}
.cap h2{font-family:var(--serif);font-size:clamp(32px,3.7vw,62px);line-height:1.08;margin:0 0 14px;color:var(--gp)}
.cap p{margin:0;max-width:52em;font-size:clamp(16px,1.3vw,25px);line-height:1.6;color:#eae4d6}
.sl.on .cap h2{animation:up 1s var(--e) .18s both}
.sl.on .cap p{animation:up 1s var(--e) .40s both}
.cr{position:absolute;right:2.6vw;bottom:2.4vh;z-index:3;font-size:clamp(11px,.85vw,15px);
 letter-spacing:.1em;color:#8fa1b6;max-width:44vw;text-align:right}
.sl.on .cr{animation:upS 1s var(--e) .9s both}

/* ---------- чертежи на пергаменте ---------- */
.fig{position:absolute;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#f4efe4,#e6dfd0)}
.fig .art{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4.5vh 5vw 0}
.fig .art img{max-width:100%;max-height:100%;width:auto;height:auto;
 border:1px solid rgba(90,70,40,.32);box-shadow:0 1.6vh 5vh rgba(40,30,10,.26)}
@keyframes figin{from{opacity:0;transform:translateY(26px) scale(.985)}to{opacity:1;transform:none}}
.sl.on .fig .art img{animation:figin 1.3s var(--e) both}
.fig .cap{position:static;padding:3vh 7vw 7vh}
.fig .cap h2{color:var(--ink)} .fig .cap p{color:var(--ink2)} .fig .cr{color:#8b7351}

/* ---------- титул ---------- */
.ti{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
 text-align:center;padding:0 10vw;background:radial-gradient(120% 95% at 50% 12%,#182943,#080e1a)}
.ti .kick{font-size:clamp(12px,1.05vw,19px);letter-spacing:.42em;text-transform:uppercase;color:var(--g);margin-bottom:24px}
.ti h1{font-family:var(--serif);font-size:clamp(42px,5.8vw,104px);line-height:1.02;margin:0 0 18px;color:var(--gp)}
.ti .rule{width:min(320px,40vw);height:1px;background:linear-gradient(90deg,transparent,var(--g),transparent);margin:12px 0 24px}
.ti p{margin:0;max-width:42em;font-size:clamp(16px,1.4vw,26px);line-height:1.6;color:#dcd6c8}
.arch{width:min(150px,15vw);opacity:.32;margin-bottom:2vh}
.arch path{stroke-dasharray:400;stroke-dashoffset:400}
.sl.on .arch path{animation:draw 2.6s var(--e) .2s both}
@keyframes draw{to{stroke-dashoffset:0}}
.sl.on .ti .kick{animation:track 1.5s var(--e) .5s both}
.sl.on .ti h1{animation:up 1.2s var(--e) .8s both}
.sl.on .ti .rule{animation:grow 1.2s var(--e) 1.4s both}
.sl.on .ti p{animation:up 1.1s var(--e) 1.6s both}

/* ---------- списки: пункты выходят по очереди ---------- */
.lst{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
 padding:0 8vw;background:radial-gradient(130% 100% at 18% 10%,#16283f,#080e18)}
.lst h2{font-family:var(--serif);font-size:clamp(32px,3.7vw,62px);margin:0 0 8px;color:var(--gp)}
.lst .sub{font-size:clamp(15px,1.25vw,23px);color:#cfc7b6;max-width:50em;line-height:1.6;margin:0 0 4vh}
.lst ol{list-style:none;margin:0;padding:0;display:grid;gap:2.1vh;counter-reset:n}
.lst li{counter-increment:n;position:relative;padding-left:clamp(52px,4.6vw,84px);
 font-size:clamp(17px,1.45vw,29px);line-height:1.45;color:#f0ead9}
.lst li::before{content:counter(n,decimal-leading-zero);position:absolute;left:0;top:.05em;
 font-family:var(--serif);font-size:clamp(19px,1.7vw,34px);color:var(--g);letter-spacing:.06em}
@keyframes left{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.sl.on .lst h2{animation:up 1s var(--e) .15s both}
.sl.on .lst .sub{animation:up 1s var(--e) .35s both}
.sl.on .lst li{animation:left .85s var(--e) both}
.sl.on .lst li:nth-child(1){animation-delay:.6s}
.sl.on .lst li:nth-child(2){animation-delay:.78s}
.sl.on .lst li:nth-child(3){animation-delay:.96s}
.sl.on .lst li:nth-child(4){animation-delay:1.14s}
.sl.on .lst li:nth-child(5){animation-delay:1.32s}
.sl.on .lst li:nth-child(6){animation-delay:1.5s}

/* ---------- источники ---------- */
#src{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 8vw;
 background:radial-gradient(130% 100% at 82% 8%,#16283f,#080e18)}
#src h2{font-family:var(--serif);font-size:clamp(32px,3.6vw,58px);margin:0 0 3.4vh;color:var(--gp)}
#src ul{list-style:none;margin:0;padding:0;display:grid;gap:1.7vh;max-width:60em}
#src li{position:relative;padding-left:30px;font-size:clamp(14px,1.15vw,22px);line-height:1.5;color:#dcd6c8}
#src li::before{content:'';position:absolute;left:0;top:.55em;width:10px;height:10px;
 border:1.5px solid var(--g);transform:rotate(45deg)}
#src .nt{margin-top:3.4vh;padding-top:2.4vh;border-top:1px dashed var(--line);max-width:60em;
 font-size:clamp(13px,1.02vw,19px);color:#8fa1b6;line-height:1.6}
.sl.on #src h2{animation:up 1s var(--e) .15s both}
.sl.on #src li{animation:upS .8s var(--e) both}
.sl.on #src li:nth-child(1){animation-delay:.45s}.sl.on #src li:nth-child(2){animation-delay:.58s}
.sl.on #src li:nth-child(3){animation-delay:.71s}.sl.on #src li:nth-child(4){animation-delay:.84s}
.sl.on #src li:nth-child(5){animation-delay:.97s}.sl.on #src li:nth-child(6){animation-delay:1.1s}
.sl.on #src .nt{animation:upS .9s var(--e) 1.4s both}

/* ---------- управление ---------- */
#nav{position:fixed;inset:0;pointer-events:none;z-index:20}
#play{position:absolute;left:2.4vw;top:2.4vh;width:clamp(44px,3.4vw,60px);height:clamp(44px,3.4vw,60px);
 border-radius:50%;border:1.5px solid var(--line);background:rgba(9,17,29,.55);color:var(--gp);
 cursor:pointer;pointer-events:auto;display:flex;align-items:center;justify-content:center;
 transition:all .3s var(--e);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#play:hover{border-color:var(--g)}
#play svg{width:44%;height:44%;fill:currentColor}
#dots{position:absolute;left:0;right:0;bottom:2.4vh;display:flex;gap:8px;justify-content:center;
 pointer-events:auto;flex-wrap:wrap;padding:0 6vw}
#dots i{width:8px;height:8px;border-radius:50%;background:rgba(245,238,223,.26);cursor:pointer;
 transition:all .4s var(--e)}
#dots i.on{background:var(--gl);transform:scale(1.6)}
#cnt{position:absolute;right:2.4vw;top:2.6vh;font-family:var(--serif);font-size:clamp(14px,1.15vw,21px);
 letter-spacing:.2em;color:var(--gp);opacity:.85;transition:color .5s ease}
#bar{position:fixed;top:0;left:0;height:3px;width:0;z-index:30;
 background:linear-gradient(90deg,var(--g),var(--gl));box-shadow:0 0 12px rgba(227,178,94,.55)}
body.light #cnt,body.light #play{color:var(--ink)}
body.light #play{background:rgba(255,252,244,.62);border-color:rgba(90,70,40,.3)}
body.light #dots i{background:rgba(64,48,26,.28)}
body.light #dots i.on{background:#a97c2c}

@media (prefers-reduced-motion:reduce){
  .sl.on .vis.cover img,.sl.on .vis.cover.alt img{animation:none}
  .sl,.sl.on{transition:opacity .3s linear;transform:none}
  .sl.on .cap h2,.sl.on .cap p,.sl.on .lst li,.sl.on .lst h2,.sl.on .lst .sub,
  .sl.on .ti h1,.sl.on .ti p,.sl.on .ti .kick,.sl.on #src li,.sl.on .fig .art img
  {animation-duration:.01s!important;animation-delay:0s!important}
}

.num{position:absolute;inset:0;overflow:hidden;background:#0a1320}
.num img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%}
.sl.on .num img{animation:kb-in 17s linear both}
.num .veil{position:absolute;inset:0;background:
 linear-gradient(180deg,rgba(7,13,24,.80) 0%,rgba(7,13,24,.30) 26%,rgba(7,13,24,.72) 58%,rgba(7,13,24,.97) 100%)}
.num .big{position:absolute;left:0;right:0;top:16vh;text-align:center;z-index:3}
.num .big b{display:block;font-family:var(--serif);font-weight:700;line-height:.86;
 color:var(--gp);text-shadow:0 1.2vh 5vh rgba(0,0,0,.75)}
.num .big span{display:block;margin-top:1.4vh;letter-spacing:.42em;text-transform:uppercase;color:var(--g)}
.num .big i{display:block;width:14vw;height:1px;margin:2.6vh auto 0;
 background:linear-gradient(90deg,transparent,var(--g),transparent)}
.sl.on .num .big b{animation:numin 1.5s var(--e) .2s both}
.sl.on .num .big span{animation:track 1.4s var(--e) .7s both}
.sl.on .num .big i{animation:grow 1.2s var(--e) 1s both}
@keyframes numin{from{opacity:0;transform:translateY(40px) scale(.94)}to{opacity:1;transform:none}}
.num .cap{z-index:3}
.vis.portal{background:radial-gradient(120% 100% at 50% 18%,#16283f,#080e18);
 position:absolute;inset:0;display:block;padding:0;overflow:hidden}
.vis.portal img{position:absolute;left:4%;top:5%;width:92%;height:58%;
 max-width:none;max-height:none;object-fit:cover;object-position:50% 45%;
 border-radius:46% 46% 12px 12px / 30% 30% 12px 12px;
 border:1.5px solid rgba(201,151,63,.5);box-shadow:0 2.4vh 9vh rgba(0,0,0,.62)}
.sl.on .vis.portal img{animation:portalin 1.4s var(--e) both}
@keyframes portalin{from{opacity:0;transform:translateY(32px) scale(.975)}to{opacity:1;transform:none}}
@media (min-aspect-ratio:1/1){
  .vis.portal img{left:26%;top:7%;width:48%;height:66%;
    border-radius:46% 46% 10px 10px / 34% 34% 10px 10px}
}

.era{position:absolute;left:7vw;top:8vh;z-index:4;font-size:clamp(11px,.95vw,17px);letter-spacing:.36em;
 text-transform:uppercase;color:var(--g);opacity:.95}
.sl.on .era{animation:track 1.3s var(--e) .1s both}
/* переключатель языка */
#lang{position:fixed;left:2.2vw;top:2.4vh;z-index:40;display:flex;gap:.5rem;pointer-events:auto}
#lang button{padding:.7rem 1.15rem;border-radius:10px;border:1.5px solid var(--line);
 background:rgba(9,17,29,.62);color:var(--gp);font-family:inherit;font-size:clamp(12px,1vw,17px);
 font-weight:700;letter-spacing:.12em;cursor:pointer;transition:all .3s var(--e);
 -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#lang button:hover{border-color:var(--g)}
#lang button.on{background:linear-gradient(180deg,rgba(201,151,63,.34),rgba(22,40,63,.55));
 border-color:var(--g);color:#fff}
body.light #lang button{color:var(--ink);background:rgba(255,252,244,.62);border-color:rgba(90,70,40,.3)}
#play{left:auto;right:2.2vw}
@media (max-aspect-ratio:1/1){
  #lang{left:5vw;top:2.2vh}
  #lang button{padding:1vh 3vw;font-size:clamp(13px,2vw,22px)}
  #play{right:5vw}
  .era{left:7vw}
}

@media (max-aspect-ratio:1/1){
  .cap{padding:0 7vw 9vh}
  .cap h2{font-size:clamp(30px,5.4vw,62px)}
  .cap p{font-size:clamp(15px,2.1vw,27px);max-width:none}
  .cr{font-size:clamp(11px,1.5vw,17px);max-width:70vw;bottom:3.4vh;right:6vw}
  .ti{padding:0 8vw}
  .ti .kick{font-size:clamp(11px,1.9vw,20px);letter-spacing:.3em}
  .ti h1{font-size:clamp(36px,7.6vw,92px);line-height:1.06}
  .ti p{font-size:clamp(15px,2.2vw,28px)}
  .arch{width:min(140px,20vw)}
  .lst{padding:0 7vw}
  .lst h2{font-size:clamp(28px,5.2vw,58px)}
  .lst .sub{font-size:clamp(14px,2vw,25px);margin-bottom:3vh}
  .lst ol{gap:1.8vh}
  .lst li{font-size:clamp(15px,2.3vw,30px);padding-left:clamp(46px,7.6vw,84px)}
  .lst li::before{font-size:clamp(18px,3vw,36px)}
  .fig .art{padding:5vh 4vw 0;align-items:center}
  .fig .art svg{width:100%;height:auto;max-width:100%;max-height:100%}
  .fig .cap{padding:2.6vh 7vw 7vh}
  #src{padding:0 7vw}
  #src h2{font-size:clamp(28px,5.2vw,56px)}
  #src li{font-size:clamp(13px,2vw,24px)}
  #src .nt{font-size:clamp(12px,1.8vw,21px)}
  .num .big b{font-size:clamp(90px,24vw,280px)}
  .num .big span{font-size:clamp(13px,2.2vw,26px)}
  .num .cap{padding:0 8vw 10vh}
  #dots{bottom:2vh}#cnt{font-size:clamp(13px,2vw,24px)}
}
@media (min-aspect-ratio:1/1){
  .num .big b{font-size:clamp(80px,13vw,210px)}
  .num .big span{font-size:clamp(12px,1.1vw,20px)}
}

/* ================= ЕДИНЫЙ ФОН ДЛЯ ВСЕХ СЛАЙДОВ =================
   Схемы больше не на пергаменте: тот же тёмный фон, что и везде. */
.fig{background:radial-gradient(130% 100% at 24% 8%,#17293f,#080e18)!important}
.fig .cap h2{color:var(--gp)!important}
.fig .cap p{color:#e8e2d4!important}
.fig .cr{color:#8fa1b6!important}
.fig .art svg,.fig .art img{border:none!important;box-shadow:none!important}
body.light #cnt,body.light #play,body.light #lang button{color:var(--gp)!important;
  background:rgba(9,17,29,.55)!important;border-color:var(--line)!important}
body.light #dots i{background:rgba(245,238,223,.26)!important}
body.light #dots i.on{background:var(--gl)!important}

/* счётчик не должен перекрывать кнопку паузы */
#cnt{right:auto;left:2.4vw;top:auto;bottom:6.2vh}
@media (max-aspect-ratio:1/1){#cnt{left:5vw;bottom:5.4vh}}


/* ============ АНИМАЦИИ ИНФОГРАФИКИ ============ */
@keyframes a-ping{0%{transform:scale(.5);opacity:.95}70%{transform:scale(2.1);opacity:0}
 100%{transform:scale(2.1);opacity:0}}
.sl.on .a-ping{transform-box:fill-box;transform-origin:50% 50%;
 animation:a-ping 2.4s cubic-bezier(.22,.9,.28,1) infinite both}
@keyframes a-rot{to{transform:rotate(360deg)}}
.sl.on .a-spin{animation:a-rot 46s linear infinite}
.sl.on .a-spin-rev{animation:a-rot 34s linear infinite reverse}
@keyframes a-riseY{from{transform:scaleY(0);opacity:.15}to{transform:scaleY(1);opacity:1}}
.sl.on .a-bar{transform-box:fill-box;transform-origin:50% 100%;
 animation:a-riseY 1s cubic-bezier(.22,.9,.28,1) both}
@keyframes a-growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sl.on .a-grow{transform-box:fill-box;transform-origin:0% 50%;
 animation:a-growX 1.15s cubic-bezier(.22,.9,.28,1) both}
@keyframes a-fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.sl.on .a-up{animation:a-fadeUp .75s var(--e) both}
@keyframes a-dash{to{stroke-dashoffset:0}}
.sl.on .a-draw{animation:a-dash 2.2s var(--e) both}
@keyframes a-popIn{from{opacity:0;transform:scale(.35)}to{opacity:1;transform:none}}
.sl.on .a-pop{transform-box:fill-box;transform-origin:50% 50%;
 animation:a-popIn .7s cubic-bezier(.34,1.4,.5,1) both}
@keyframes a-move{to{stroke-dashoffset:-320}}
.sl.on .a-flow{animation:a-move 7s linear infinite}
@keyframes a-pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.9;transform:scale(1.045)}}
.sl.on .a-glow{transform-box:fill-box;transform-origin:50% 50%;
 animation:a-pulse 3.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
  .sl.on .a-bar,.sl.on .a-grow,.sl.on .a-up,.sl.on .a-draw,.sl.on .a-pop
  {animation-duration:.01s!important;animation-delay:0s!important}
  .sl.on .a-flow,.sl.on .a-glow,.sl.on .a-spin,.sl.on .a-spin-rev,
  .sl.on .a-ping{animation:none!important}
}

/* ============ СЛАЙД ОРГАНИЗАЦИИ ============ */
.org{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
 justify-content:center;text-align:center;padding:0 8vw;
 background:radial-gradient(130% 100% at 50% 14%,#17293f,#080e18)}
.org .plate{background:#fff;border-radius:20px;padding:2.8vh 5vw;margin-bottom:4.4vh;
 border:1px solid rgba(201,151,63,.4);box-shadow:0 2.4vh 8vh rgba(0,0,0,.55);
 display:flex;align-items:center;justify-content:center}
.org .plate img{display:block;width:auto;height:auto;
 max-width:min(620px,62vw);max-height:min(150px,13vh)}
.org .orgtext{display:flex;flex-direction:column;align-items:center}
.org h2{font-family:var(--serif);font-size:clamp(28px,3.4vw,56px);line-height:1.1;
 margin:0 0 16px;color:var(--gp)}
.org p{margin:0;max-width:40em;font-size:clamp(16px,1.4vw,26px);line-height:1.62;color:#e8e2d4}
.org .orgleft{display:flex;flex-direction:column;align-items:center;gap:2.2vh}
.org .ono{font-family:var(--serif);font-size:clamp(15px,1.2vw,22px);letter-spacing:.34em;
 color:var(--g);opacity:.85}
.org .obadge{display:flex;align-items:baseline;gap:.8rem;margin-top:3.4vh;
 padding-top:2.4vh;border-top:1px solid rgba(201,151,63,.3)}
.org .obadge b{font-family:var(--serif);font-weight:700;line-height:1;
 font-size:clamp(38px,3.6vw,68px);color:var(--gl)}
.org .obadge span{font-size:clamp(13px,1.02vw,20px);letter-spacing:.14em;
 text-transform:uppercase;color:var(--dim)}
@keyframes badgeIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.sl.on .org .obadge{animation:badgeIn 1s var(--e) 1.05s both}
.sl.on .org .ono{animation:upS .9s var(--e) 1.2s both}
.org .rule{width:min(280px,34vw);height:1px;margin:0 0 3vh;
 background:linear-gradient(90deg,transparent,var(--g),transparent)}
@keyframes plateIn{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}
.sl.on .org .plate{animation:plateIn 1.1s cubic-bezier(.22,.9,.28,1) both}
.sl.on .org h2{animation:up 1s var(--e) .5s both}
.sl.on .org .rule{animation:grow 1s var(--e) .7s both}
.sl.on .org p{animation:up 1s var(--e) .8s both}
@media (min-aspect-ratio:1/1){.org .orgtext{align-items:flex-start}}
@media (max-aspect-ratio:1/1){.org .obadge{justify-content:center}}
@media (max-aspect-ratio:1/1){
  .org{padding:0 7vw}
  .org h2{font-size:clamp(28px,5vw,56px)}
  .org p{font-size:clamp(15px,2.1vw,28px);max-width:none}
  .org .plate{padding:3vh 6vw}
  .org .plate img{max-width:72vw;max-height:12vh}
}

/* ============ ВИДЕОСЛАЙДЫ ============ */
.vidwrap{position:absolute;inset:0;overflow:hidden;background:#0a1320}
.vidwrap video{position:absolute;inset:0;width:100%;height:100%;
 object-fit:cover;object-position:50% 45%;background:#0a1320}
.vidwrap .veil{position:absolute;inset:0;pointer-events:none;background:
 linear-gradient(180deg,rgba(7,13,24,.74) 0%,rgba(7,13,24,.18) 22%,rgba(7,13,24,.66) 50%,rgba(7,13,24,.99) 100%)}
.vidwrap .cap{z-index:3}
.vis.portal video{position:absolute;left:4%;top:5%;width:92%;height:58%;
 object-fit:cover;object-position:50% 45%;background:#0a1320;
 border-radius:46% 46% 12px 12px / 30% 30% 12px 12px;
 border:1.5px solid rgba(201,151,63,.5);box-shadow:0 2.4vh 9vh rgba(0,0,0,.62)}
.sl.on .vis.portal video{animation:portalin 1.4s var(--e) both}
@media (min-aspect-ratio:1/1){
  .vis.portal video{left:26%;top:7%;width:48%;height:66%;
    border-radius:46% 46% 10px 10px / 34% 34% 10px 10px}
}
/* --- метка «это видеослайд» --- */
.vidsec .era::before{content:'';display:inline-block;width:.62em;height:.62em;border-radius:50%;
 background:var(--gl);margin-right:.75em;vertical-align:baseline;
 box-shadow:0 0 0 0 rgba(227,178,94,.55);animation:recdot 2.2s ease-in-out infinite}
@keyframes recdot{0%,100%{opacity:.45;box-shadow:0 0 0 0 rgba(227,178,94,.5)}
 50%{opacity:1;box-shadow:0 0 0 .55em rgba(227,178,94,0)}}
.sl.novid .era::before{background:var(--dim);animation:none;opacity:.5;box-shadow:none}

/* --- заглушка, когда файла ещё нет --- */
.vidph{position:absolute;inset:0;z-index:4;display:none;align-items:center;justify-content:center;
 padding:0 8vw;text-align:center}
.sl.novid .vidph{display:flex}
.sl.novid .vidwrap video{filter:grayscale(.75) brightness(.34) blur(2px)}
.sl.novid .vidwrap .veil{background:
 linear-gradient(180deg,rgba(7,13,24,.86) 0%,rgba(7,13,24,.74) 40%,rgba(7,13,24,.97) 100%)}
.vidph-in{border:1.5px dashed rgba(201,151,63,.55);border-radius:20px;
 padding:5vh 5vw;background:rgba(9,17,29,.5);
 -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);max-width:44em}
.vidph-play{width:clamp(64px,6vw,104px);height:clamp(64px,6vw,104px);margin:0 auto 3vh;
 border-radius:50%;border:2px solid var(--gl);display:flex;align-items:center;justify-content:center}
.vidph-play svg{width:46%;height:46%;fill:var(--gl);margin-left:8%}
.vidph-t{font-family:var(--serif);font-size:clamp(26px,2.4vw,46px);color:var(--gp);
 line-height:1.15;margin-bottom:2.4vh}
.vidph-f{display:inline-block;font-family:"Consolas","Courier New",monospace;
 font-size:clamp(15px,1.25vw,25px);letter-spacing:.06em;color:var(--gl);
 border:1px solid rgba(201,151,63,.45);border-radius:8px;padding:.5em 1.1em;margin-bottom:2.2vh;
 background:rgba(201,151,63,.1)}
.vidph-h{font-size:clamp(14px,1.05vw,21px);color:var(--dim);line-height:1.55}
@keyframes phIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.sl.on.novid .vidph-in{animation:phIn 1s var(--e) both}
/* пока файла нет — подпись слайда приглушена, чтобы не спорить с заглушкой */
.sl.novid .cap{opacity:.5}

/* ============ КНОПКИ ============ */
#ctrls{position:fixed;right:2.2vw;top:2.4vh;z-index:40;display:flex;gap:.6rem;pointer-events:auto}
#ctrls button{position:static;width:clamp(44px,3.4vw,60px);height:clamp(44px,3.4vw,60px);
 border-radius:50%;border:1.5px solid var(--line);background:rgba(9,17,29,.55);color:var(--gp);
 cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s var(--e);
 -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#ctrls button:hover{border-color:var(--g)}
#ctrls button svg{width:46%;height:46%;fill:currentColor}
#snd.on{border-color:var(--g);background:linear-gradient(180deg,rgba(201,151,63,.34),rgba(22,40,63,.55));color:#fff}

middle\" font-size=\"16\" font-weight=\"400\" fill=\"#8fa1b6\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:2.0s\">По приказам комитета за 2025 год</text></svg>"}, {"era": "Как это устроено", "t": "У внедрения опыта есть свой адрес", "x": "В комитете работает управление цифровизации отрасли и внедрения передового зарубежного опыта. Именно оно превращает увиденное в поездке в семинар, методику или программу.", "items": ["Изучение опыта в поездке", "Приглашение зарубежного эксперта", "Семинар для специалистов отрасли", "Пилотное применение на объекте", "Пересмотр стандарта или методики", "Обучение региональных управлений"], "cr": "Источник: Комитет по автомобильным дорогам"}, {"era": "19 июня 2026", "t": "Немецкий эксперт учит моделировать потоки", "x": "Семинар по транспортному моделированию провела доктор Фани Хациоаниду, специалист немецкой компании Dornier Group. Разбирали анализ транспортных потоков, расчёт нагрузки и современные методы моделирования при планировании дорог. Организатор — управление цифровизации и внедрения передового зарубежного опыта.", "cr": "Источник: Комитет по автомобильным дорогам, 19.06.2026"}, {"era": "3 июля 2026", "t": "Платные дороги: разбор чужой практики", "x": "В Центре анализа технического состояния дорог обсуждали с той же немецкой компанией перспективы строительства платных дорог в Узбекистане, диагностику покрытия, показатели интенсивности движения и анализ транспортных потоков — в том числе проект платной дороги на трассе А380 в Каракалпакстане.", "cr": "Источник: Комитет по автомобильным дорогам, 03.07.2026"}, {"era": "Февраль 2026", "t": "Стандарты приводят к международным", "x": "Указом Президента ПФ-25 от 16 февраля 2026 года реформы в сфере технического регулирования ускоряются на основе передовой международной практики: технические регламенты и стандарты вводятся по международным требованиям, лабораторные испытания организуются в соответствии с международными стандартами.", "cr": "Источники: Указ ПФ-25 от 16.02.2026; Комитет по автомобильным дорогам, 08.04.2026"}, {"era": "Турция", "t": "Сравнили приборы и методики измерений", "x": "Турецкая делегация осмотрела передвижные пункты весового и габаритного контроля, мобильную лабораторию и диагностическую технику, познакомилась с цифровым программным обеспечением. Стороны сравнили, как в двух странах снимают геометрические параметры дорог.", "cr": "Источник: Комитет по автомобильным дорогам, 11.02.2026"}, {"era": "Китай", "t": "Методика диагностики и «умные дороги»", "x": "С китайской компанией Jiangsu Dongjiao в Центре анализа технического состояния дорог разбирали методологию диагностики дорожной сети. Внедрение этих технологий рассматривают как шаг к системе «умных дорог» в Узбекистане.", "cr": "Источник: Комитет по автомобильным дорогам, 17.02.2026"}, {"era": "19 июня 2026", "t": "Опыт превращается в информационную систему", "x": "Онлайн-семинар по информационной системе «Пункт ремонта дорог» собрал специалистов со всей страны. Это и есть последний шаг цепочки: увиденное за рубежом становится программой, которой пользуются региональные управления каждый день.", "cr": "Источник: Комитет по автомобильным дорогам, 19.06.2026"}, {"era": "Видео", "t": "Технология на объекте", "x": "Что из увиденного за рубежом уже работает на дороге.", "cr": "Видео: архив Комитета по автомобильным дорогам", "vmiss": "Здесь будет видеоролик", "vhint": "Положите файл video/06.mp4 рядом с этой страницей"}, {"era": "Что уже перенято", "t": "Опыт, который дошёл до дороги", "x": "Не всё из увиденного применимо: климат, грунты и нагрузки у каждой страны свои. Но эти направления уже вошли в повседневную работу отрасли.", "items": ["Цифровая диагностика покрытия", "Весогабаритный контроль на ходу", "Транспортное моделирование потоков", "Лабораторные испытания по стандартам", "Подготовка проектов платных дорог", "Информационные системы ремонта"], "cr": "Источник: Комитет по автомобильным дорогам"}, {"era": "Правило", "big": "1", "bigsub": "условие для любой заимствованной технологии", "t": "Чужое решение проверяют на своей дороге", "x": "Между зарубежной поездкой и новой методикой всегда стоит проверка: образцы покрытия берут кернами прямо с объекта и испытывают в лаборатории на прочность и плотность. Технология считается принятой только после того, как выдержала местные грунты, климат и нагрузки.", "cr": "Источник: Комитет по автомобильным дорогам, 20.05.2026"}, {"t": "Источники", "items": ["Комитет по автомобильным дорогам — сведения о командировках 2025 года для изучения международного опыта", "Комитет по автомобильным дорогам — сообщения о семинарах и встречах 2025—2026 годов", "Указ Президента ПФ-25 от 16 февраля 2026 года о техническом регулировании", "gov.uz/uzavtoyul, раздел «О комитете» — задачи по внедрению международных стандартов"], "note": "Раздел посвящён тому, как зарубежные технологии и методики попадают в дорожную отрасль Узбекистана. Число командировок и специалистов приведено по приказам комитета за 2025 год. Встречи с зарубежными компаниями описаны по официальным сообщениям комитета; названия компаний приведены так, как они указаны в этих сообщениях. Партнёрские организации и банки рассматриваются в разделе «Международные организации и финансовые институты», страны-партнёры — в разделе «Сотрудничество с зарубежными странами». Фотографии — из официальных сообщений Комитета по автомобильным дорогам."}], "uz": [{"sub": "Axborot kioski · avtomobil yoʻllari tarixi", "t": "Xorijiy tajribalar", "x": "Tarmoq chet eldan aynan nimani olib keladi: texnologiya, asbob, standart va metodikalar — hamda ular oʻzbek yoʻllariga qanday yetib boradi."}, {"era": "2025-yil", "big": "70", "bigsub": "mutaxassis · 23 ta xizmat safari", "t": "Tajribani odamlar olib keladi", "x": "Faqat 2025-yilning oʻzida qoʻmita va uning tizim tashkilotlari xalqaro tajribani oʻrganish maqsadida chet el xizmat safarlari boʻyicha yigirma uchta buyruq chiqardi. Ularda yetmish nafar mutaxassis — boshqarma boshliqlaridan laboratoriya muhandislarigacha — ishtirok etdi.", "cr": "Manba: Avtomobil yoʻllari qoʻmitasi, 19.08.2026"}, {"era": "Oʻn ikki yil", "t": "Oʻn ikki yilda uch yuz bir safar", "x": "2014-yildan 2025-yilgacha tarmoq 301 marta chet el xizmat safarini amalga oshirdi. Choʻqqi 2023-yilga toʻgʻri keldi — ellik toʻrtta safar. 2020—2021-yillardagi pasayish chegaralar yopilgani bilan izohlanadi: ikki yilda atigi oʻn uchta chiqish boʻlgan.", "cr": "Manbalar: qoʻmitaning 2014—2024-yillar jamlanmasi; 2025-yil buyruqlari", "svg": "<svg viewBox=\"58 34 944 640\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"530\" y=\"62\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" fill=\"#e3b25e\" font-family=\"Manrope,sans-serif\" letter-spacing=\".14em\" class=\"a-up\" style=\"animation-delay:0.0s\">OʻN IKKI YILDAGI CHET EL SAFARLARI</text><text x=\"530\" y=\"136\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"400\" fill=\"#8fa1b6\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:0.3s\">2014—2025-yillar, safarlar soni</text><path d=\"M122,566.0 H958\" stroke=\"#c9973f\" stroke-width=\"1\" opacity=\".2\" class=\"a-up\" style=\"animation-delay:0.40s\"/><text x=\"106\" y=\"572.0\" text-anchor=\"end\" font-size=\"17\" font-weight=\"400\" fill=\"#8fa1b6\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:0.4s\">0</text><path d=\"M122,434.7 H958\" stroke=\"#c9973f\" stroke-width=\"1\" opacity=\".2\" class=\"a-up\" style=\"animation-delay:0.53s\"/><text x=\"106\" y=\"440.66666666666663\" text-anchor=\"end\" font-size=\"17\" font-weight=\"400\" fill=\"#8fa1b6\" font-family=\"Manrope,sans-serif\" letter-spacing=\"0\" class=\"a-up\" style=\"animation-delay:0.53s\">20</text><path d=\"M122,303.3 H958\" stroke=\"#c9973f\" stroke-width=\"1\" opacity=\".2\" class=\"a-up\" style=\"animation-delay:0.65s\"/><text x=\"106\" y=\"309.3333333333333\" text-anchor=\"end\" font-size=\"1 ylantiradi.", "items": ["Safarda tajribani oʻrganish", "Xorijiy ekspertni taklif qilish", "Soha mutaxassislari uchun seminar", "Obyektda sinov tariqasida qoʻllash", "Standart yoki metodikani qayta koʻrib chiqish", "Hududiy boshqarmalarni oʻqitish"], "cr": "Manba: Avtomobil yoʻllari qoʻmitasi"}, {"era": "2026-yil 19-iyun", "t": "Nemis eksperti oqimlarni modellashtirishni oʻrgatdi", "x": "Transport modellashtirish boʻyicha seminarni Germaniyaning “Dornier Group” kompaniyasi mutaxassisi, doktor Fani Xatsiioanidu oʻtkazdi. Transport oqimlarini tahlil qilish, yuklamani hisoblash va yoʻllarni rejalashtirishda zamonaviy modellashtirish usullari koʻrib chiqildi. Tashkilotchi — Sohani raqamlashtirish va ilgʻor xorijiy tajribalarni tatbiq etish boshqarmasi.", "cr": "Manba: Avtomobil yoʻllari qoʻmitasi, 19.06.2026"}, {"era": "2026-yil 3-iyul", "t": "Pullik yoʻllar: oʻzga amaliyotni oʻrganish", "x": "Avtomobil yoʻllari texnik holati tahlili markazida oʻsha nemis kompaniyasi bilan Oʻzbekistonda pullik yoʻllar barpo etish istiqbollari, qoplama diagnostikasi, harakat jadalligi koʻrsatkichlari va transport oqimlari tahlili muhokama qilindi — shu jumladan Qoraqalpogʻistondagi A380 yoʻlida pullik yoʻl loyihasi.", "cr": "Manba: Avtomobil yoʻllari qoʻmitasi, 03.07.2026"}, {"era": "2026-yil fevral", "t": "Standartlar xalqaro talablarga keltirilmoqda", "x": "Prezidentning 2026-yil 16-fevraldagi PF-25-son farmoniga muvofiq texnik jihatdan tartibga solish sohasidagi islohotlar ilgʻor xalqaro amaliyot asosida jadallashtirilmoqda: texnik reglament va standartlar xalqaro talablar asosida joriy etiladi, laboratoriya sinovlari xalqaro standartlarga muvofiq tashkil qilinadi.", "cr": "Manbalar: PF-25-son farmon, 16.02.2026; Avtomobil yoʻllari qoʻmitasi, 08.04.2026"}, {"era": "Turkiya", "t": "Asbob va oʻlchov metodikalari solishtirildi", "x": "Turk delegatsiyasi vazn va hajm nazorati koʻchma punktlari, mobil laboratoriya va diagnostika texnikasini koʻzdan kechirdi, raqamli dasturiy taʼminot bilan tanishdi. Tomonlar ikki mamlakatda yoʻllarning geometrik oʻlchamlari qanday olinishini taqqosladilar.", "cr": "Manba: Avtomobil yoʻllari qoʻmitasi, 11.02.2026"}, {"era": "Xitoy", "t": "Diagnostika metodikasi va «aqlli yoʻllar»", "x": "Xitoyning “Jiangsu Dongjiao” kompaniyasi bilan Avtomobil yoʻllari texnik holatini tahlil qilish markazida yoʻl tarmogʻini diagnostika qilish metodologiyasi koʻrib chiqildi. Bu texnologiyalarni joriy etish Oʻzbekistonda «aqlli yoʻllar» tizimi sari qadam sifatida qaralmoqda.", "cr": "Manba: Avtomobil yoʻllari qoʻmitasi, 17.02.2026"}, {"era": "2026-yil 19-iyun", "t": "Tajriba axborot tizimiga aylanadi", "x": "«Yoʻl taʼmirlash punkti» axborot tizimi boʻyicha onlayn seminar butun mamlakatdan mutaxassislarni yigʻdi. Bu zanjirning oxirgi bosqichi: chet elda koʻrilgan narsa hududiy boshqarmalar har kuni foydalanadigan dasturga aylanadi.", "cr": "Manba: Avtomobil yoʻllari qoʻmitasi, 19.06.2026"}, {"era": "Video", "t": "Obyektdagi texnologiya", "x": "Chet elda koʻrilganlardan nimasi allaqachon yoʻlda ishlayapti.", "cr": "Video: Avtomobil yoʻllari qoʻmitasi arxivi", "vmiss": "Bu yerga videorolik qoʻyiladi", "vhint": "video/06.mp4 faylini shu sahifa yoniga joylashtiring"}, {"era": "Nimalar oʻzlashtirildi", "t": "Yoʻlgacha yetib kelgan tajriba", "x": "Koʻrilganlarning hammasi ham qoʻllanilavermaydi: har bir mamlakatning iqlimi, grunti va yuklamasi oʻziga xos. Ammo bu yoʻnalishlar tarmoqning kundalik ishiga allaqachon kirib keldi.", "items": ["Qoplamaning raqamli diagnostikasi", "Harakatdagi vazn va hajm nazorati", "Transport oqimlarini modellashtirish", "Standartlar boʻyicha laboratoriya sinovlari", "Pullik yoʻl loyihalarini tayyorlash", "Taʼmirlashning axborot tizimlari"], "cr": "Manba: Avtomobil yoʻllari qoʻmitasi"}, {"era": "Qoida", "big": "1", "bigsub": "har qanday oʻzlashtirilgan texnologiya sharti", "t": "Oʻzga yechim oʻz yoʻlimizda sinaladi", "x": "Chet el safari bilan yangi metodika oʻrtasida doimo sinov turadi: qoplama namunalari obyektdan kern usulida olinib, laboratoriyada mustahkamlik va zichlikka tekshiriladi. Texnologiya mahalliy grunt, iqlim va yuklamaga bardosh bergandagina qabul qilingan hisoblanadi.", "cr": "Manba: Avtomobil yoʻllari qoʻmitasi, 20.05.2026"}, {"t": "Manbalar", "items": ["Avtomobil yoʻllari qoʻmitasi — xalqaro tajribani oʻrganish uchun 2025-yildagi xizmat safarlari maʼlumotlari", "Avtomobil yoʻllari qoʻmitasi — 2025—2026-yillardagi seminar va uchrashuvlar xabarlari", "Prezidentning 2026-yil 16-fevraldagi PF-25-son farmoni", "gov.uz/uzavtoyul, «Qoʻmita haqida» boʻlimi — xalqaro standartlarni joriy etish vazifalari"], "note": "Boʻlim xorijiy texnologiya va metodikalar Oʻzbekiston yoʻl tarmogʻiga qanday kirib kelishiga bagʻishlangan. Safarlar va mutaxassislar soni qoʻmitaning 2025-yilgi buyruqlari boʻyicha keltirilgan. Xorijiy kompaniyalar bilan uchrashuvlar qoʻmitaning rasmiy xabarlari asosida tavsiflangan; kompaniya nomlari shu xabarlardagidek berilgan. Sherik tashkilot va banklar «Xalqaro tashkilotlar va moliya institutlari» boʻlimida, sherik davlatlar «Chet el davlatlari bilan hamkorlik» boʻlimida koʻrib chiqiladi. Fotosuratlar — Avtomobil yoʻllari qoʻmitasining rasmiy xabarlaridan."}], "en": [{"sub": "Information kiosk · history of the road network", "t": "Foreign experience", "x": "What exactly the sector brings back from abroad — technologies, instruments, standards and methods — and how they reach Uzbekistan's roads."}, {"era": "2025", "big": "70", "bigsub": "specialists · 23 trips", "t": "Experience travels with people", "x": "In 2025 alone the committee and its system organisations issued twenty-three orders for trips abroad to study international experience. Seventy specialists took part, from department heads to laboratory engineers.", "cr": "Source: the Committee for Roads, 19.08.2026"}, {"era": "Twelve years", "t": "Three hundred and one trips in twelve years", "x": "Between 2014 and 2025 the sector made 301 trips abroad. The peak was 2023, with fifty-four. The dip function noiseBuf(c){

  var len=Math.floor(c.sampleRate*0.5), b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);

/* шорох перелистывания: полосовой шум со скольжением частоты + мягкий низ */
function sndSwipe(dir){
  var c=ac(); if(!c) return; var t=c.currentTime;
  var s=c.createBufferSource(); s.buffer=noiseBuf(c);
  var bp=c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.15;

  s.start(t); s.stop(t+0.34);
  var o=c.createOscillator(), og=c.createGain();

  og.gain.setValueAtTime(0.0001,t);
  og.gain.linearRampToValueAtTime(0.045,t+0.02);

/* ---------- звук анимаций: синтез, без аудиофайлов ---------- */
function _env(g,t,peak,atk,rel){
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(peak,t+atk);
  g.gain.exponentialRampToValueAtTime(0.0006,t+rel);

  var c=ac(); if(!c) return; var t=c.currentTime;
  [174,262,392].forEach(function(f,i){
    var o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.setValueAtTime(f,t);
    _env(g,t+i*0.06,0.05-i*0.011,0.05,1.5);
    o.connect(g); g.connect(c.destination); o.start(t+i*0.06); o.stop(t+i*0.06+1.7);
  });
}

}

/* ============ анимированный счёт чисел ============ */
(function(){
"use strict";
function parts(txt){
  var m=/-?[\d][\d\s.,\u00a0]*/.exec(txt);
  if(!m) return null;
  var body=m[0].replace(/[\s\u00a0]+$/,'');
  var pre=txt.slice(0,m.index), post=txt.slice(m.index+body.length);
  var dot=body.lastIndexOf('.'), com=body.lastIndexOf(',');
  var decSep=null, decLen=0;
  var last=Math.max(dot,com);
  if(last>-1 && body.length-last-1<=2 && body.length-last-1>0){
    decSep=body[last]; decLen=body.length-last-1;
  }
  var grp=' ';
  var intPart=decSep? body.slice(0,last) : body;
  var g=/[\s\u00a0.,]/.exec(intPart);
  if(g) grp=g[0]==='\u00a0'?' ':g[0];
  var num=parseFloat(intPart.replace(/[\s\u00a0.,]/g,'')+(decSep?'.'+body.slice(last+1):''));
  var grouped=/[\s\u00a0.,]/.test(intPart);
  return {pre:pre,post:post,num:num,decSep:decSep,decLen:decLen,grp:grp,grouped:grouped};
}
function fmt(p,v){
  var s=p.decLen? v.toFixed(p.decLen) : Math.round(v).toString();
  var ip=p.decLen? s.slice(0,s.indexOf('.')) : s;
  var fp=p.decLen? s.slice(s.indexOf('.')+1) : '';
  if(p.grouped) ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,p.grp);
  return p.pre+ip+(p.decLen? p.decSep+fp : '')+p.post;
}
var running=new WeakMap();
function run(el){
  var full=el.dataset.full;
  if(full===undefined){ full=el.textContent.trim(); }
  el.dataset.full=full;
  var p=parts(full);
  if(!p||!isFinite(p.num)){ el.textContent=full; return; }
  var isYear=(!p.decLen && p.num>1500 && p.num<2200 && !p.grouped);
  var from=isYear? p.num-26 : 0;
  var dur=isYear? 1100 : 1500, t0=null;
  var id={}; running.set(el,id);
  function step(ts){
    if(running.get(el)!==id) return;
    if(t0===null) t0=ts;
    var k=Math.min(1,(ts-t0)/dur);
    var e=1-Math.pow(1-k,3);
    el.textContent=fmt(p, from+(p.num-from)*e);
    if(k<1) requestAnimationFrame(step); else el.textContent=full;
  }
  el.textContent=fmt(p,from);
  requestAnimationFrame(step);
}
function sync(){
  [].forEach.call(document.querySelectorAll('.sl'),function(sec){
    var els=sec.querySelectorAll('.count');
    if(!els.length) return;
    if(sec.classList.contains('on')){
      if(sec.dataset.counted==='1') return;      /* уже считали на этом показе */
      sec.dataset.counted='1';
      [].forEach.call(els,function(el){ setTimeout(function(){ run(el); },260); });
    } else {
      sec.dataset.counted='';
      [].forEach.call(els,function(el){
        running.set(el,{});
        if(el.dataset.full!==undefined) el.textContent=el.dataset.full;
      });
    }
  });
}
var tmr=null;
new MutationObserver(function(){ clearTimeout(tmr); tmr=setTimeout(sync,50); })
  .observe(document.getElementById('deck'),
           {attributes:true,subtree:true,attributeFilter:['class']});
/* при смене языка тексты перерисовываются — сбрасываем запомненное */
[].forEach.call(document.querySelectorAll('#lang button'),function(b){
  b.addEventListener('click',function(){
    setTimeout(function(){
      [].forEach.call(document.querySelectorAll('.count'),function(el){
        delete el.dataset.full;
      });
      [].forEach.call(document.querySelectorAll('.sl'),function(x){ x.dataset.counted=''; });
      sync();
    },60);
  });
});
setTimeout(sync,700);
})();

/* ============ управление видео ============ */
(function(){
"use strict";
var deck=document.getElementById('deck');
var vids=[].slice.call(deck.querySelectorAll('video'));
var snd=document.getElementById('snd');
var MUTED=true;
var ICON_OFF='<path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16.2 9.2l5.6 5.6M21.8 9.2l-5.6 5.6" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/>';
var ICON_ON='<path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16.4 8.6a5.4 5.4 0 010 6.8M19.2 6.2a9 9 0 010 11.6" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/>';
if(snd) snd.innerHTML='<svg viewBox="0 0 24 24">'+ICON_OFF+'</svg>';
if(!vids.length) return;

vids.forEach(function(v){
  var sec=v.closest('.sl');
  v.muted=true; v.playsInline=true; v.setAttribute('playsinline','');
  v.addEventListener('loadedmetadata',function(){
    if(isFinite(v.duration)&&v.duration>1.2) sec.dataset.d=Math.round(v.duration*1000);
    sec.classList.remove('novid');
  });
  v.addEventListener('error',function(){ sec.classList.add('novid'); });
  setTimeout(function(){
    if(v.networkState===v.NETWORK_NO_SOURCE || (!v.videoWidth && v.readyState===0))
      sec.classList.add('novid');
  },4000);
});

function sync(){
  vids.forEach(function(v){
    var sec=v.closest('.sl');
    if(sec.classList.contains('on')){
      try{ v.currentTime=0; var pr=v.play(); if(pr&&pr.catch) pr.catch(function(){}); }catch(e){}
    } else { try{ v.pause(); }catch(e){} }
  });
}
var tmr=null;
new MutationObserver(function(){ clearTimeout(tmr); tmr=setTimeout(sync,40); })
  .observe(deck,{attributes:true,subtree:true,attributeFilter:['class']});
sync();

document.getElementById('play').addEventListener('click',function(){
  setTimeout(function(){
    var paused=!!document.querySelector('#pi path');
    vids.forEach(function(v){
      var sec=v.closest('.sl'); if(!sec.classList.contains('on')) return;
      if(paused) v.pause(); else { var pr=v.play(); if(pr&&pr.catch) pr.catch(function(){}); }
    });
  },40);
});

snd.addEventListener('click',function(e){
  e.stopPropagation();
  MUTED=!MUTED;
  vids.forEach(function(v){ v.muted=MUTED; });
  snd.classList.toggle('on',!MUTED);
  snd.innerHTML='<svg viewBox="0 0 24 24">'+(MUTED?ICON_OFF:ICON_ON)+'</svg>';
});
})();

<script>
/* кнопки листания: используют уже существующую навигацию слайдера
   и возвращают автопрокрутку (кнопка play скрыта) */
(function(){
  var deck=document.getElementById('deck');
  function key(k){ dispatchEvent(new KeyboardEvent('keydown',{key:k,bubbles:true})); }
  function keepPlaying(){
    setTimeout(function(){
      if(document.querySelector('#pi path')) key(' ');   /* сейчас пауза — снова запускаем */
    },80);
  }
  document.getElementById('prevb').addEventListener('click',function(e){
    e.stopPropagation(); key('ArrowLeft'); keepPlaying();
  });
  document.getElementById('nextb').addEventListener('click',function(e){
    e.stopPropagation(); key('ArrowRight'); keepPlaying();
  });
  if(deck) deck.addEventListener('click',keepPlaying);   /* тап по слайду тоже не «замораживает» показ */
})();
</script>
<script>
/* ---- звук нажатия для всех кликов: синтез WebAudio, без аудиофайлов (работает офлайн) ---- */
(function(){
  var on = true;
  try{ on = new URLSearchParams(location.search).get('sound') !== 'off'; }catch(e){}
  var ac = null;
  function ctx(){
    try{
      if(!ac){ var A = window.AudioContext || window.webkitAudioContext; if(!A) return null; ac = new A(); }
      if(ac.state === 'suspended') ac.resume();
    }catch(e){ return null; }
    return ac;
  }
  function tick(){
    if(!on) return;
    var c = ctx(); if(!c) return;
    try{
      var t = c.currentTime;
      var o = c.createOscillator(), g = c.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(1500, t);
      o.frequency.exponentialRampToValueAtTime(620, t + 0.06);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.13, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0004, t + 0.13);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + 0.15);
    }catch(e){}
  }
  window.tpClick = tick;
  document.addEventListener('pointerdown', tick, true);
  document.addEventListener('keydown', function(e){ if(e.key === ' ' || e.key === 'Enter') tick(); }, true);
})();
</script>
<script>
/* ---- киоск: блокируем масштабирование (щипок двумя пальцами, двойной тап, Ctrl+колесо) ---- */
(function(){
  function stop(e){ if(e.cancelable) e.preventDefault(); }
  ['gesturestart','gesturechange','gestureend'].forEach(function(t){
    document.addEventListener(t, stop, {passive:false});               /* Safari / iOS */
  });
  document.addEventListener('touchstart', function(e){ if(e.touches.length>1) stop(e); }, {passive:false});
  document.addEventListener('touchmove',  function(e){ if(e.touches.length>1) stop(e); }, {passive:false});
  var last = 0;
  document.addEventListener('touchend', function(e){                    /* двойной тап */
    var now = Date.now();
    if(now - last < 350) stop(e);
    last = now;
  }, {passive:false});
  document.addEventListener('dblclick', stop, {passive:false});
  document.addEventListener('wheel', function(e){ if(e.ctrlKey || e.metaKey) stop(e); }, {passive:false});
  document.addEventListener('keydown', function(e){
    if((e.ctrlKey || e.metaKey) && ['+','-','=','_','0'].indexOf(e.key) !== -1) stop(e);
  }, {passive:false});
  document.addEventListener('contextmenu', stop, {passive:false});      /* долгое нажатие */
})();
</script>
<script>
/* ---- 5 минут без касаний -> возврат на титульный экран (как блокировка телефона) ---- */
(function(){
  var IDLE_MS = 300000, t = null;
  function home(){ location.href = 'index.html'; }
  function reset(){ clearTimeout(t); t = setTimeout(home, IDLE_MS); }
  ['pointerdown','pointermove','touchstart','touchmove','mousedown','mousemove','wheel','keydown']
    .forEach(function(ev){ document.addEventListener(ev, reset, {passive:true}); });
  reset();
})();
</script>

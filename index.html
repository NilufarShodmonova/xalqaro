<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yo‘l sohasida xalqaro aloqalar va hamkorlik — bo‘limlar</title>
<style>
:root{
  --tp-navy-900:#070d18;
  --tp-navy-800:#0b1526;
  --tp-navy-700:#101f38;
  --tp-navy-600:#16294a;
  --tp-line:rgba(212,175,110,.34);
  --tp-line-soft:rgba(212,175,110,.16);
  --tp-gold:#d8b26c;
  --tp-gold-hi:#f2dda8;
  --tp-gold-deep:#b98f45;
  --tp-sand:#e9dcc4;
  --tp-text:#dfd4bf;
  --tp-text-dim:rgba(223,212,191,.68);
  --tp-display:"Trajan Pro","Palatino Linotype","Book Antiqua",Georgia,"Times New Roman",serif;
  --tp-body:"Segoe UI",Tahoma,Verdana,"Helvetica Neue",sans-serif;
  --tp-shadow:0 1.2rem 3rem rgba(0,0,0,.55);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ============================================================
   СЦЕНА 16:9 — 1920 x 1080
   1rem = 16px при 1920x1080; сцена всегда сохраняет пропорцию
   ============================================================ */
html{font-size:min(0.833333vw, 1.481481vh);}
body{
  font-family:var(--tp-body);
  background:#000;
  color:var(--tp-text);
  width:100vw;height:100vh;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  user-select:none;-webkit-user-select:none;
  cursor:default;
}
.tp-stage{
  position:relative;
  width:100vw;height:100vh;         /* на весь экран тачпанели 1920x1080 */
  max-width:100vw;max-height:100vh;
  overflow:hidden;
  background:var(--tp-navy-900);
  box-shadow:0 0 6rem rgba(0,0,0,.8);
}
img{display:block}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ============ ЭКРАНЫ ============ */
.tp-screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  opacity:0;visibility:hidden;
  transition:opacity .5s ease, visibility .5s;
  z-index:1;
}
.tp-screen.is-active{opacity:1;visibility:visible;z-index:5}

/* ============ ФОН ============ */
.tp-bg{
  position:absolute;inset:0;z-index:0;overflow:hidden;
  background:radial-gradient(130% 95% at 50% 0%, #14263f 0%, #0a1120 58%, #070d18 100%);
}
.tp-bg__img{
  position:absolute;inset:0;
  width:100%;height:100%;object-fit:cover;object-position:50% 50%;
  transition:opacity 1s ease, filter 1s ease, transform 1s ease;
}
.tp-bg__veil{
  position:absolute;inset:0;
  background:
    linear-gradient(180deg, rgba(7,13,24,.62) 0%, rgba(7,13,24,.18) 26%, rgba(7,13,24,.22) 52%, rgba(7,13,24,.78) 82%, rgba(7,13,24,.94) 100%),
    radial-gradient(58% 42% at 50% 44%, rgba(5,10,20,.52) 0%, rgba(5,10,20,0) 100%);
  transition:opacity 1s ease, background 1s ease;
}
.tp-bg__grain{
  position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;pointer-events:none;
  background-image:
    repeating-linear-gradient(0deg,rgba(255,255,255,.25) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 1px,transparent 1px 3px);
}
.tp-stage.tp-mode-inner .tp-bg__img{opacity:.42;filter:blur(1.4px) saturate(.88)}
.tp-stage.tp-mode-inner .tp-bg__veil{
  background:linear-gradient(180deg, rgba(5,10,20,.66) 0%, rgba(6,12,22,.74) 30%, rgba(5,10,20,.86) 70%, rgba(5,10,20,.94) 100%);
}

/* ============ ЭКРАН 1 — ТИТУЛЬНЫЙ / ЯЗЫК ============ */
#tp-splash{
  display:flex;flex-direction:column;align-items:center;
  padding:2.4rem 4rem 3rem;text-align:center;
}

.tp-splash__top{
  display:flex;flex-direction:row;align-items:center;justify-content:flex-start;
  gap:2rem;width:100%;flex:0 0 auto;
  padding:1.2rem 2.4rem;
  background:linear-gradient(135deg, rgba(16,31,56,.78) 0%, rgba(11,22,40,.62) 50%, rgba(7,14,26,.85) 100%);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(212,175,110,.35);
  border-radius:1.4rem;
  box-shadow:0 1rem 3rem rgba(0,0,0,.55), inset 0 1px 1px rgba(255,255,255,.12);
  animation:tp-fade-down .9s .1s both;
}
.tp-logo{width:6.4rem;height:auto;flex:0 0 auto;filter:drop-shadow(0 .5rem 1.4rem rgba(0,0,0,.75))}
.tp-org{
  display:flex;flex-direction:column;text-align:left;
  font-size:1.02rem;line-height:1.5;letter-spacing:.14em;
  color:var(--tp-sand);text-transform:uppercase;font-weight:500;
}
.tp-org b{
  display:block;font-family:var(--tp-display);font-weight:700;
  color:var(--tp-gold-hi);font-size:1.28em;line-height:1.35;
  letter-spacing:.18em;margin-top:.35rem;text-shadow:0 2px 10px rgba(0,0,0,.6);
}

.tp-splash__mid{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1rem;animation:tp-fade-up 1s .45s both;
  position:relative;top:-3.125rem;      /* заголовок выше на 50px */
}
.tp-hero{
  font-family:var(--tp-display);
  font-size:2.8rem;line-height:1.22;letter-spacing:.05em;
  max-width:63.75rem;               /* 1020px */
  width:100%;margin:2.5rem auto 0;  /* верхний отступ 40px */
  padding:0 1.5rem;text-align:center;
  background:linear-gradient(180deg,#fbfbfb 0%,#fff5e3 45%,#ffc257 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .25rem .7rem rgba(0,0,0,.7)) drop-shadow(0 .7rem 2.4rem rgba(0,0,0,.6));
}
.tp-hero__sub{
  font-family:var(--tp-display);
  font-size:1.55rem;letter-spacing:.3em;color:var(--tp-gold-hi);
  max-width:63.75rem;text-align:center;
  text-transform:uppercase;margin-top:1.1rem;padding-left:.3em;
  text-shadow:0 .15rem .45rem rgba(0,0,0,.85), 0 .4rem 1.6rem rgba(0,0,0,.6);
}
.tp-orn{display:flex;align-items:center;justify-content:center;gap:1.4rem;width:100%;margin-top:1.2rem}
.tp-orn__line{height:1px;flex:0 1 18rem;background:linear-gradient(90deg,transparent,var(--tp-line))}
.tp-orn__line--r{background:linear-gradient(90deg,var(--tp-line),transparent)}
.tp-orn svg{width:1.8rem;height:1.8rem;fill:none;stroke:var(--tp-gold);stroke-width:5;opacity:.9}

.tp-splash__bot{display:flex;flex-direction:column;align-items:center;gap:1.4rem;width:100%;flex:0 0 auto;padding-top:1rem}
.tp-langs{display:flex;gap:3rem;justify-content:center}
.tp-lang{
  position:relative;width:15rem;height:12rem;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  gap:.35rem;padding-bottom:2.6rem;
  background:linear-gradient(180deg,rgba(16,31,56,.62),rgba(8,15,28,.86));
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid var(--tp-line);
  border-radius:7.5rem 7.5rem 1rem 1rem;
  box-shadow:var(--tp-shadow), inset 0 0 4rem rgba(216,178,108,.06);
  transition:transform .28s cubic-bezier(.2,.9,.3,1.2), box-shadow .28s, border-color .28s;
  animation:tp-fade-up .9s both;
}
.tp-lang:nth-child(1){animation-delay:.85s}
.tp-lang:nth-child(2){animation-delay:.97s}
.tp-lang:nth-child(3){animation-delay:1.09s}
.tp-lang:active{transform:scale(.965)}
.tp-lang:hover{border-color:rgba(212,175,110,.85);box-shadow:0 1.4rem 3.6rem rgba(0,0,0,.6),0 0 3rem rgba(216,178,108,.22),inset 0 0 4rem rgba(216,178,108,.12)}
.tp-lang__code{
  font-family:var(--tp-display);font-size:3.2rem;letter-spacing:.12em;
  color:var(--tp-gold-hi);margin-top:auto;padding-top:2.2rem;
}
.tp-lang__flagline{width:3.8rem;height:1px;background:var(--tp-line);margin:.9rem 0 0}

/* ============ ШАПКА ВНУТРЕННИХ ЭКРАНОВ ============ */
.tp-head{
  display:flex;align-items:center;gap:1.8rem;
  padding:1.5rem 3.4rem;
  border-bottom:1px solid rgba(212,175,110,.35);
  background:linear-gradient(135deg, rgba(16,31,56,.85) 0%, rgba(11,22,40,.70) 50%, rgba(7,14,26,.92) 100%);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 1rem 3rem rgba(0,0,0,.5);
  flex:0 0 auto;
}
.tp-head__logo{width:4.6rem;height:auto;flex:0 0 auto}
.tp-head__txt{flex:1;min-width:0;text-align:left}
.tp-welcome{
  font-family:var(--tp-display);
  font-size:1.9rem;letter-spacing:.22em;
  color:var(--tp-gold-hi);text-transform:uppercase;line-height:1.2;
}
.tp-head__org{
  font-size:.92rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--tp-text-dim);line-height:1.5;margin-top:.35rem;
}
.tp-head__tools{display:flex;align-items:center;gap:.9rem;flex:0 0 auto}
/* язык и «домой» — по центру внизу экрана меню */
.tp-menu__tools{
  position:absolute;left:0;right:0;bottom:2.6rem;   /* прижаты к низу экрана */
  display:flex;align-items:center;justify-content:center;gap:1rem;
  animation:tp-fade-up .9s .55s both;
}

.tp-pill{
  padding:.7rem 1.4rem;border:1px solid var(--tp-line);border-radius:.5rem;
  font-size:1rem;letter-spacing:.2em;text-transform:uppercase;color:var(--tp-text-dim);
  transition:all .25s;
}
.tp-pill.is-on{color:var(--tp-navy-900);background:linear-gradient(180deg,var(--tp-gold-hi),var(--tp-gold-deep));border-color:transparent;font-weight:600}
.tp-pill:active{transform:scale(.94)}

.tp-icobtn{
  width:3.6rem;height:3.6rem;border:1px solid var(--tp-line);border-radius:.6rem;
  display:flex;align-items:center;justify-content:center;transition:all .25s;
}
.tp-icobtn svg{width:1.8rem;height:1.8rem;stroke:var(--tp-gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tp-icobtn:active{transform:scale(.92)}
.tp-icobtn:hover{border-color:var(--tp-gold);background:rgba(216,178,108,.09)}

/* ============ ЭКРАН 2 — МЕНЮ ============ */
#tp-menu{padding:0}
.tp-menu__body{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2.2rem;padding:1.6rem 5rem 7rem;min-height:0;
}
.tp-menu__title{
  font-family:var(--tp-display);
  font-size:2.5rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--tp-sand);text-align:center;line-height:1.2;
  text-shadow:0 .2rem .8rem rgba(0,0,0,.7);
  animation:tp-fade-down .7s both;
  flex:0 0 auto;width:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.tp-menu__sub{
  font-family:var(--tp-body);
  font-size:1.12rem;letter-spacing:.28em;text-transform:uppercase;color:var(--tp-text-dim);
  margin-top:.9rem;
}
.tp-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:1.8rem;
  width:100%;max-width:104rem;align-items:stretch;justify-content:center;
  margin:0 auto;flex:0 0 auto;
}
.tp-card{
  position:relative;overflow:hidden;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  gap:.9rem;padding:1.8rem 1.2rem 1.8rem;
  min-height:19rem;
  background:linear-gradient(170deg,rgba(22,41,74,.86) 0%,rgba(11,21,38,.94) 100%);
  border:1px solid var(--tp-line);border-radius:1.2rem;
  box-shadow:var(--tp-shadow);
  text-align:center;
  transition:transform .3s cubic-bezier(.2,.9,.3,1.2), border-color .3s, box-shadow .3s;
  animation:tp-fade-up .8s both;
}
.tp-card:nth-child(1){animation-delay:.10s}
.tp-card:nth-child(2){animation-delay:.20s}
.tp-card:nth-child(3){animation-delay:.30s}
.tp-card:nth-child(4){animation-delay:.40s}
.tp-card:nth-child(5){animation-delay:.50s}
.tp-card::before{
  content:"";position:absolute;inset:0;border-radius:1.2rem;pointer-events:none;
  background:radial-gradient(70% 50% at 50% 0%, rgba(216,178,108,.16), transparent 70%);
  opacity:0;transition:opacity .35s;
}
.tp-card:hover{border-color:rgba(212,175,110,.8);box-shadow:0 1.6rem 4rem rgba(0,0,0,.65),0 0 3.4rem rgba(216,178,108,.16)}
.tp-card:hover::before{opacity:1}
.tp-card:active{transform:scale(.975)}

.tp-arch{position:relative;width:7.3rem;height:8.3rem;flex:0 0 auto;margin:0 auto}
.tp-arch__frame{position:absolute;inset:0;width:100%;height:100%}
.tp-arch__frame path{fill:none;stroke:var(--tp-gold);stroke-width:3.4;stroke-linecap:round}
.tp-arch__ico{
  position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
  width:3.4rem;height:3.4rem;
  fill:none;stroke:var(--tp-gold);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
}
.tp-card__num{
  font-family:var(--tp-display);font-size:1.05rem;letter-spacing:.4em;
  color:var(--tp-gold-deep);
}
.tp-card__title{
  font-family:var(--tp-display);
  max-width:100%;
  font-size:1.12rem;line-height:1.32;letter-spacing:.05em;   /* < 20px */
  color:var(--tp-gold-hi);text-transform:uppercase;
  hyphens:manual;                                             /* без переносов по слогам */
  display:flex;align-items:center;justify-content:center;flex:1 1 auto;
}
.tp-card__years{display:block;font-size:.68em;letter-spacing:.22em;opacity:.72;margin-top:.45em;font-weight:400}

.tp-menu__footer{
  display:flex;justify-content:center;align-items:center;
  padding:.8rem 2rem 1.8rem;width:100%;flex:0 0 auto;
}

/* ---- разделы в подготовке ---- */
.tp-card.is-soon{opacity:.66}
.tp-card.is-soon::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:repeating-linear-gradient(135deg,rgba(212,178,90,.07) 0 12px,transparent 12px 24px);
}
#tp-toast{
  position:absolute;left:50%;bottom:7rem;transform:translate(-50%,1.2rem);z-index:60;
  padding:1.2rem 2.6rem;border-radius:1rem;
  background:rgba(10,17,32,.94);border:1px solid rgba(212,178,90,.55);
  color:#F0DCA8;font-size:1.4rem;letter-spacing:.18em;font-weight:700;white-space:nowrap;
  box-shadow:0 1.4rem 4rem rgba(0,0,0,.55);
  opacity:0;pointer-events:none;transition:opacity .35s ease, transform .35s ease;
}
#tp-toast.is-on{opacity:1;transform:translate(-50%,0)}

/* ============ АНИМАЦИИ ============ */
@keyframes tp-fade-up{from{opacity:0;transform:translateY(3.2rem)}to{opacity:1;transform:none}}
@keyframes tp-fade-down{from{opacity:0;transform:translateY(-2.4rem)}to{opacity:1;transform:none}}
@keyframes tp-pulse{0%,100%{opacity:.55}50%{opacity:1}}
</style>
</head>

    {icon:'practice',   num:'IV',  title:'INTERNATIONAL BEST PRACTICES',                            href:'4_xorijiy-tajribalar%20(1).html',   ready:1},
    {icon:'joint',      num:'V',   title:'JOINT INFRASTRUCTURE PROJECTS',                           href:'5_qoshma-loyihalar.html',     ready:1}
  ]
}
};

/* ==================================================================
   ЛОГИКА
   ================================================================== */
(function(){
  var lang = 'uz';
  var IDLE_MS = 180000;   /* 3 минуты бездействия -> титульный экран */
  var idleTimer = null;

  var $  = function(s){ return document.querySelector(s); };
  var $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };
  var stage = document.getElementById('tp-stage');
  var grid = $('#tp-grid');

  function showScreen(id){
    $$('.tp-screen').forEach(function(s){ s.classList.remove('is-active'); });
    $(id).classList.add('is-active');
    stage.classList.toggle('tp-mode-inner', id !== '#tp-splash');
  }

  function archSVG(iconKey){
    return '<div class="tp-arch">' +
      '<svg class="tp-arch__frame" viewBox="0 0 110 122" preserveAspectRatio="xMidYMid meet">' +
        '<path d="' + TP_ARCH_PATH + '"/>' +
      '</svg>' +
      '<svg class="tp-arch__ico" viewBox="0 0 24 24">' + TP_ICONS[iconKey] + '</svg>' +
    '</div>';
  }

  function renderMenu(){
    var d = TP_DATA[lang];
    if ($('#tp-head-welcome')) $('#tp-head-welcome').textContent = d.welcome;
    if ($('#tp-head-org'))     $('#tp-head-org').innerHTML = d.org;
    $('#tp-menu-title').textContent = d.menuTitle;
    $('#tp-menu-sub').textContent   = d.menuSub;

    grid.innerHTML = '';
    d.sections.forEach(function(sec, i){
      var b = document.createElement('button');
      b.className = 'tp-card';
      b.setAttribute('data-index', i);
      if (sec.href) b.setAttribute('data-href', sec.href);
      if (sec.ready === 0) { b.setAttribute('data-ready','0'); b.classList.add('is-soon'); }
      b.innerHTML =
        archSVG(sec.icon) +
        '<div class="tp-card__num">' + sec.num + '</div>' +
        '<div class="tp-card__title">' + sec.title + '</div>';
      grid.appendChild(b);
    });

    $$('.tp-pill').forEach(function(p){
      p.classList.toggle('is-on', p.getAttribute('data-lang') === lang);
    });
  }

  function bipReadLang(){
    var l = null;
    try { l = new URLSearchParams(window.location.search).get('lang'); } catch(e){}
    if (l !== 'uz' && l !== 'ru' && l !== 'en') {
      l = null;
      try { l = window.localStorage.getItem('bipLang'); } catch(e){}
    }
    return (l === 'uz' || l === 'ru' || l === 'en') ? l : null;
  }
  function bipSaveLang(l){ try { window.localStorage.setItem('bipLang', l); } catch(e){} }

  function withLang(href){
    var hash = '', i = href.indexOf('#');
    if (i !== -1) { hash = href.slice(i); href = href.slice(0, i); }
    href += (href.indexOf('?') === -1 ? '?' : '&') + 'lang=' + lang;
    return href + hash;
  }

  function setLang(l){
    lang = l;
    document.documentElement.lang = l;
    bipSaveLang(l);
    renderMenu();
  }

  $$('.tp-lang').forEach(function(b){
    b.addEventListener('click', function(){
      setLang(b.getAttribute('data-lang'));
      showScreen('#tp-menu');
    });
  });

  $$('.tp-pill').forEach(function(b){
    b.addEventListener('click', function(){ setLang(b.getAttribute('data-lang')); });
  });

  var tpToastT = null;
  function tpToast(msg){
    var el = document.getElementById('tp-toast');
    if (!el) { el = document.createElement('div'); el.id='tp-toast'; stage.appendChild(el); }
    el.textContent = msg;
    el.classList.add('is-on');
    if (tpToastT) clearTimeout(tpToastT);
    tpToastT = setTimeout(function(){ el.classList.remove('is-on'); }, 2600);
  }

  grid.addEventListener('click', function(e){
    var card = e.target.closest('.tp-card');
    if (!card) return;
    var href = card.getAttribute('data-href');
    if (card.getAttribute('data-ready') === '0') { tpToast(TP_DATA[lang].soon); return; }
    if (href) window.location.href = withLang(href);
  });

  $('#tp-home').addEventListener('click', function(){ showScreen('#tp-splash'); });

  function resetIdle(){
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){ showScreen('#tp-splash'); }, IDLE_MS);
  }
  ['pointerdown','touchstart','mousemove','wheel','keydown'].forEach(function(ev){
    document.addEventListener(ev, resetIdle, {passive:true});
  });

  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
  document.addEventListener('dblclick', function(e){ e.preventDefault(); });

  var bipSaved = bipReadLang();
  if (bipSaved) { lang = bipSaved; document.documentElement.lang = bipSaved; }
  bipSaveLang(lang);

  renderMenu();
  resetIdle();

  function checkHashNav(){
    if (window.location.hash === '#tp-menu' || window.location.hash === '#menu' || window.location.search.indexOf('menu') !== -1) {
      showScreen('#tp-menu');
    } else if (window.location.hash === '#tp-splash' || window.location.hash === '#splash') {
      showScreen('#tp-splash');
    }
  }
  window.addEventListener('hashchange', checkHashNav);
  checkHashNav();
})();
</script>
</body>
</html>
